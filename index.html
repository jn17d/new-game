            g.rect(uStart, vMin, rackW, vRange).fill({ color: 0x555555 });
            // shelf lines across the bay every 0.8 m
            for (let sv = vMin; sv <= vMax; sv += 0.8 * PX) {
              g.moveTo(uStart, sv).lineTo(uStart + rackW, sv);
            }
            g.stroke({ color: 0x3a3a3a, width: 1 });
            // end uprights at the bay's left + right edges
            g.rect(uStart, vMin, 2, vRange).fill({ color: 0x3a3a3a });
            g.rect(uStart + rackW - 2, vMin, 2, vRange).fill({ color: 0x3a3a3a });
            // 2px aisle shadow to the rack's right (light is top-left)
            g.rect(uStart + rackW, vMin, 2, vRange).fill({ color: 0x6a6c6c });
          } else {
            // walkway strip + dashed centre safety line (1.5 m dash, 0.5 m gap)
            g.rect(uStart, vMin, stripW, vRange).fill({ color: 0x8a8c8c });
            const lineU = uStart + stripW / 2;
            for (let sv = vMin; sv < vMax; sv += 2 * PX) {
              g.rect(lineU, sv, 1, Math.min(1.5 * PX, vMax - sv)).fill({ color: 0xc8a000 });
            }
          }
        }
      }

      else if (cls === 'office' || cls === 'hq') {
        // 1. Carpet base + dithered weave — one dark px per 2px lattice cell,
        //    all batched into a single fill. Skipped entirely on footprints
        //    whose lattice exceeds the 2000-drawn-pixel cap.
        g.rect(uMin, vMin, uRange, vRange).fill({ color: 0x7a6e8a });
        const ditherStep = 2;
        const dCols = Math.max(0, Math.floor(uRange / ditherStep));
        const dRows = Math.max(0, Math.floor(vRange / ditherStep));
        if (dCols * dRows <= 4000) {                  // ≤ 2000 pixels actually drawn
          for (let ci = 0; ci < dCols; ci++) {
            for (let ri = 0; ri < dRows; ri++) {
              if ((ci + ri) % 2 === 0) g.rect(uMin + ci * ditherStep, vMin + ri * ditherStep, 1, 1);
            }
          }
          g.fill({ color: 0x6e6280 });
        }
        // 2. Central corridor along U — splits the floor into two banks
        const corrW = 1.5 * PX;
        g.rect(uMin, vMid - corrW / 2, uRange, corrW).fill({ color: 0x8a7e9c });

        // 3. Cubicles (4 m × 3 m cells) in both banks, high-U end left free
        //    for the meeting room. Pass 1: partition walls (right + outer
        //    edge) — queued line work must be stroked BEFORE any fill() is
        //    called, or the fill would swallow the pending path.
        const cellU = 4 * PX, cellV = 3 * PX;
        const mRoomW = Math.min(6 * PX, uRange * 0.25);
        const colCount = Math.max(0, Math.floor((uRange - mRoomW) / cellU));
        const cells = [];                              // { cu, cvNear, cvFar }
        for (let col = 0; col < colCount; col++) {
          const cu = uMin + col * cellU;
          for (let bank = 0; bank < 2; bank++) {
            const dir = bank === 0 ? -1 : 1;           // banks grow away from corridor
            const edge = vMid + dir * corrW / 2;
            const rows = Math.floor(
              Math.abs(dir < 0 ? edge - vMin : vMax - edge) / cellV);
            for (let row = 0; row < rows; row++) {
              const cvNear = edge + dir * row * cellV; // corridor-side edge
              const cvFar = cvNear + dir * cellV;      // wall-side edge
              cells.push({ cu, cvNear, cvFar });
              g.moveTo(cu + cellU, cvNear).lineTo(cu + cellU, cvFar);
              g.moveTo(cu, cvFar).lineTo(cu + cellU, cvFar);
            }
          }
        }
        g.stroke({ color: 0xc0b4d4, width: 1 });       // one stroke for all walls

        // Pass 2: desks (2 m × 1 m at the cell's outer edge) + chairs
        // (0.7 m × 0.7 m, 0.5 m in front of the desk, corridor side)
        const deskW = 2 * PX, deskH = PX, chairS = 0.7 * PX;
        for (const { cu, cvNear, cvFar } of cells) {
          const dir = cvFar < cvNear ? -1 : 1;
          const deskU = cu + PX * 0.3;
          const deskV = dir < 0 ? cvFar + PX * 0.3 : cvFar - deskH - PX * 0.3;
          g.rect(deskU + 1, deskV + 1, deskW, deskH).fill({ color: 0xa89c7c });  // 1px SE shadow
          g.rect(deskU, deskV, deskW, deskH).fill({ color: 0xc8bc98 });
          const chairU = deskU + deskW / 2 - chairS / 2;
          const chairV = dir < 0 ? deskV + deskH + PX * 0.5 : deskV - chairS - PX * 0.5;
          g.rect(chairU, chairV, chairS, chairS).fill({ color: 0x3c3448 });
        }

        // 4. Meeting room at the high-U end — carpet fill (hides the
        //    corridor/cubicle work inside), 2px border, centred table
        const mRoomU = uMax - mRoomW;
        const mRoomV = vMin + INSET_PX, mRoomH = vRange - INSET_PX * 2;
        g.rect(mRoomU, mRoomV, mRoomW, mRoomH).fill({ color: 0x7a6e8a });
        g.rect(mRoomU, mRoomV, mRoomW, mRoomH).stroke({ color: 0xd4c8e8, width: 2 });
        const tW = Math.min(3 * PX, mRoomW - PX * 0.6), tH = 1.5 * PX;
        if (tW > 0 && mRoomH > tH + PX * 0.5) {
          g.rect(mRoomU + (mRoomW - tW) / 2, vMid - tH / 2, tW, tH).fill({ color: 0xc8bc98 });
        }
      }

      return cont;
    };

    // ---- PixiJS conveyor belts inside factory buildings ----
    // Each factory line renders as one animated belt module (custom Piskel
    // sprite from machines-data.js), laid out on an interior grid that
    // follows the footprint's longest edge. Layouts are computed once per
    // building and cached; the render loop only updates position / scale /
    // rotation from map.project(), so panning and zooming stay cheap.
    const BELT_MIN_ZOOM = 18;                     // belts fade in with interiors (15.5→16.5)
    const MODULE_M = 4;                           // world size (m) of one 32px module
    const ROW_GAP_M = MODULE_M * (22 / 32);       // trimmed art is 22px of 32
    const FRAME_MS = 120;                         // ms per animation frame
    const MAX_SLOTS = 64;                         // safety cap per building
    const M_PER_DEG_LAT = 111320;

    const bboxCache = new Map();
    const bboxOfGeometry = (id, geometry) => {
      if (bboxCache.has(id)) return bboxCache.get(id);
      let minX = 180, minY = 90, maxX = -180, maxY = -90;
      const scan = (coords) => {
        for (const c of coords) {
          if (typeof c[0] === 'number') {
            if (c[0] < minX) minX = c[0];
            if (c[0] > maxX) maxX = c[0];
            if (c[1] < minY) minY = c[1];
            if (c[1] > maxY) maxY = c[1];
          } else scan(c);
        }
      };
      scan(geometry.coordinates);
      const b = [minX, minY, maxX, maxY];
      bboxCache.set(id, b);
      return b;
    };

    // Bearing (screen convention, clockwise from east) of the polygon's
    // longest edge — belt rows align to the building's main wall.
    const longestEdgeAngle = (geometry, cy) => {
      let ring = null;
      if (geometry.type === 'Polygon') ring = geometry.coordinates[0];
      else if (geometry.type === 'MultiPolygon' && geometry.coordinates.length) {
        ring = geometry.coordinates[0][0];
      }
      if (!ring || ring.length < 2) return 0;
      const mLon = M_PER_DEG_LAT * Math.cos(cy * Math.PI / 180);
      let best = 0, bestLen = -1;
      for (let i = 0; i < ring.length - 1; i++) {
        const dx = (ring[i + 1][0] - ring[i][0]) * mLon;
        const dy = -(ring[i + 1][1] - ring[i][1]) * M_PER_DEG_LAT;
        const len = dx * dx + dy * dy;
        if (len > bestLen) { bestLen = len; best = Math.atan2(dy, dx); }
      }
      // Fold into -90..90° so the axis (not its direction) is deterministic
      if (best > Math.PI / 2) best -= Math.PI;
      if (best < -Math.PI / 2) best += Math.PI;
      return best;
    };

    // Layout cache: id -> { cx, cy, angle, slots: [{sx, sy}] }
    // Slots are ordered row-by-row along the long axis (they fill in order
    // as lines are added). sx/sy are offsets in module-pixel space (32px =
    // one module) relative to the bbox centre, in the rotated local frame.
    const layoutCache = new Map();
    const layoutFor = (id, geometry) => {
      if (layoutCache.has(id)) return layoutCache.get(id);
      const [minX, minY, maxX, maxY] = bboxOfGeometry(id, geometry);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const mLon = M_PER_DEG_LAT * Math.cos(cy * Math.PI / 180);
      const angle = longestEdgeAngle(geometry, cy);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);

      // Extent of the bbox once rotated into the belt frame
      let minE = Infinity, maxE = -Infinity, minN = Infinity, maxN = -Infinity;
      for (const [lon, lat] of [[minX, minY], [minX, maxY], [maxX, minY], [maxX, maxY]]) {
        const ex = (lon - cx) * mLon, ny = -(lat - cy) * M_PER_DEG_LAT;
        const e = ex * cosA + ny * sinA;      // world -> local (rotate -angle)
        const n = -ex * sinA + ny * cosA;
        if (e < minE) minE = e; if (e > maxE) maxE = e;
        if (n < minN) minN = n; if (n > maxN) maxN = n;
      }

      const slots = [];
      const cols = Math.max(1, Math.floor((maxE - minE) / MODULE_M));
      const rows = Math.max(1, Math.floor((maxN - minN) / ROW_GAP_M));
      for (let r = 0; r < rows && slots.length < MAX_SLOTS; r++) {
        const n = minN + (r + 0.5) * ROW_GAP_M;
        for (let c = 0; c < cols && slots.length < MAX_SLOTS; c++) {
          const e = minE + (c + 0.5) * MODULE_M;
          // local -> world lng/lat, then point-in-polygon (holes respected)
          const wx = cx + (e * cosA - n * sinA) / mLon;
          const wy = cy - (e * sinA + n * cosA) / M_PER_DEG_LAT;
          if (turf.booleanPointInPolygon([wx, wy], geometry)) {
            slots.push({ sx: (e / MODULE_M) * 32, sy: (n / MODULE_M) * 32 });
          }
        }
      }
      if (!slots.length) slots.push({ sx: 0, sy: 0 }); // tiny building: 1 centre belt

      const layout = { cx, cy, angle, slots };
      layoutCache.set(id, layout);
      return layout;
    };

    // ---- Interior floor rendering (factory / warehouse / office) ----
    // Sits below beltRoot in the PixiJS scene, fades in at INTERIOR_MIN_ZOOM.
    let interiorRoot = null;
    const interiorContainers = new Map();   // building id -> PIXI.Container

    let pixiApp = null;
    let beltRoot = null;                        // holds one container per building
    let beltFrames = [];                        // one texture per animation frame
    const beltContainers = new Map();           // building id -> PIXI.Container

    // One belt module. Today: Piskel flipbook sprite, rotated 90° so the
    // belt's vertical flow runs along +x (the row direction). If a seamless
    // cap-less `tile` is ever added to MACHINE_ASSETS.conveyor, swap this
    // factory over to a TilingSprite — everything else stays unchanged.
    const makeBeltSprite = () => {
      const s = new PIXI.Sprite(beltFrames[0] || PIXI.Texture.EMPTY);
      s.anchor.set(0.5);
      s.rotation = Math.PI / 2;
      return s;
    };

    const renderBelts = () => {
      if (!pixiApp || !beltRoot) return;
      const zoom = map.getZoom();
      const alpha = smoothstep(INTERIOR_MIN_ZOOM - 0.5, INTERIOR_MIN_ZOOM + 0.5, zoom);
      beltRoot.alpha = alpha;
      if (alpha === 0 || !beltFrames.length) { beltRoot.visible = false; return; }
      beltRoot.visible = true;

      const w = pixiApp.screen.width, h = pixiApp.screen.height;
      const mpp = 78271.5 * Math.cos(CHATTERIS[1] * Math.PI / 180) / Math.pow(2, zoom);
      const scale = (MODULE_M / mpp) / 32;
      const frameIdx = Math.floor(performance.now() / FRAME_MS) % beltFrames.length;

      for (const [id, rec] of owned) {
        if (rec.cls !== 'factory' || !rec.lines) continue;   // belts are factory-class only
        const lines = rec.lines;
        let cont = beltContainers.get(id);
        const geom = geometryFor(id);
        if (!geom) { if (cont) cont.visible = false; continue; }
        const layout = layoutFor(id, geom);

        if (!cont) {
          cont = new PIXI.Container();
          beltRoot.addChild(cont);
          beltContainers.set(id, cont);
        }

        // Off-screen culling via the footprint bbox
        const [minX, minY, maxX, maxY] = bboxOfGeometry(id, geom);
        const tl = map.project([minX, maxY]);
        const br = map.project([maxX, minY]);
        if (br.x < 0 || tl.x > w || br.y < 0 || tl.y > h) { cont.visible = false; continue; }
        cont.visible = true;

        const n = Math.min(lines, layout.slots.length);
        while (cont.children.length < n) cont.addChild(makeBeltSprite());
        for (let i = 0; i < cont.children.length; i++) {
          const s = cont.children[i];
          s.visible = i < n;
          if (i < n) {
            s.position.set(layout.slots[i].sx, layout.slots[i].sy);
            s.texture = beltFrames[frameIdx];
          }
        }
        const anchor = map.project([layout.cx, layout.cy]);
        cont.position.set(anchor.x, anchor.y);
        cont.rotation = layout.angle;
        cont.scale.set(scale);
      }

      // Drop containers for buildings that no longer have factory lines
      for (const id of [...beltContainers.keys()]) {
        const r = owned.get(id);
        if (!r || r.cls !== 'factory' || !r.lines) {
          beltContainers.get(id).destroy({ children: true });
          beltContainers.delete(id);
        }
      }
    };

    // Hook for factory-state changes (reset, etc.) — drops cached layouts and
    // belt containers so the next frame rebuilds from fresh state.
    const refreshBelts = () => {
      layoutCache.clear();
      capacityCache.clear();
      for (const c of beltContainers.values()) c.destroy({ children: true });
      beltContainers.clear();
    };

    // Per-frame interior pass — same cheap pattern as renderBelts(): the
    // expensive buildInterior() runs once per building (cached in
    // interiorContainers); every other tick only reprojects position /
    // rotation / scale from map.project(). Fades the whole layer in over
    // INTERIOR_MIN_ZOOM ±0.5 zoom and culls off-screen buildings.
    const renderInteriors = () => {
      if (!pixiApp || !interiorRoot) return;
      const zoom = map.getZoom();
      const alpha = smoothstep(INTERIOR_MIN_ZOOM - 0.5, INTERIOR_MIN_ZOOM + 0.5, zoom);
      interiorRoot.alpha = alpha;
      if (alpha === 0) { interiorRoot.visible = false; return; }
      interiorRoot.visible = true;

      const mpp = 78271.5 * Math.cos(CHATTERIS[1] * Math.PI / 180) / Math.pow(2, zoom);
      const scale = (MODULE_M / mpp) / 32;
      const w = pixiApp.screen.width, h = pixiApp.screen.height;

      for (const [id, rec] of owned) {
        const geom = geometryFor(id);
        if (!geom) continue;

        // Bbox cull — same pattern as belt rendering
        const [minX, minY, maxX, maxY] = bboxOfGeometry(id, geom);
        const tl = map.project([minX, maxY]);
        const br = map.project([maxX, minY]);
        if (br.x < 0 || tl.x > w || br.y < 0 || tl.y > h) {
          const existing = interiorContainers.get(id);
          if (existing) existing.visible = false;
          continue;
        }

        let cont = interiorContainers.get(id);
        if (!cont) {
          cont = buildInterior(id, rec.cls, geom);
          interiorRoot.addChild(cont);
          interiorContainers.set(id, cont);
        }

        const layout = layoutFor(id, geom);
        const anchor = map.project([layout.cx, layout.cy]);
        cont.position.set(anchor.x, anchor.y);
        cont.rotation = layout.angle;
        cont.scale.set(scale);
        cont.visible = true;
      }

      // Remove containers for buildings that are no longer owned
      for (const id of [...interiorContainers.keys()]) {
        if (!owned.has(id)) {
          interiorContainers.get(id).destroy({ children: true });
          interiorContainers.delete(id);
        }
      }
    };

    // Hook for ownership changes (buy / sell / reset) — drops the cached
    // interiors so the next frame rebuilds them (the class may have changed).
    // Mirrors refreshBelts().
    const refreshInteriors = () => {
      for (const c of interiorContainers.values()) c.destroy({ children: true });
      interiorContainers.clear();
    };

    // ---- Animated 📦 deliveries (factory→warehouse, storage→buyer) ----
    // Boxes live in lng/lat and are re-projected every frame, so they stay
    // glued to buildings through pans and zooms. Each box is one quadratic
    // bezier hop (smoothstep-eased, capped perpendicular lift), staggered
    // 90 ms apart, capped at MAX_BOXES live entries, ~20 px screen-space so
    // deliveries, capped at MAX_BOXES live entries, ~20-32 px screen-space so
    // they read at any zoom. Rendering goes through BOX_VISUALS.make() so the
    // look is data-driven: the pixel-art crate from machines-data.js is used
    // when present, the 📦 emoji otherwise (see build-machines-data.mjs).
    const MAX_BOXES = 60;
    const BOX_STAGGER_MS = 90;
    const BOX_PROD_MS = 1400;        // short/fast hop: production & spill
    const BOX_SALE_MS = 1800;        // longer hop: sale to an NPC buyer
    const BOX_FONT_PX = 20;

    const boxes = [];                // live entries: { from, to, start, dur, view }
    let boxRoot = null;              // PIXI container (created with the overlay)
    let boxTexture = null;           // set once a MACHINE_ASSETS.box sprite loads

    // Pure maths (unit-tested): position along the hop at time `now` as
    // [lng, lat]. t is clamped to 0..1, eased with smoothstep, and the bezier
    // control point lifts perpendicular off the straight line (lift capped so
    // short hops don't over-arc).
    const boxPointAt = (b, now) => {
      const t = Math.max(0, Math.min(1, (now - b.start) / b.dur));
      const ease = t * t * (3 - 2 * t);
      const dx = b.to[0] - b.from[0], dy = b.to[1] - b.from[1];
      const lift = Math.min(0.15, Math.hypot(dx, dy) * 0.1);
      const cx = (b.from[0] + b.to[0]) / 2 - dy * lift;
      const cy = (b.from[1] + b.to[1]) / 2 + dx * lift;
      const u = 1 - ease;
      return [
        u * u * b.from[0] + 2 * u * ease * cx + ease * ease * b.to[0],
        u * u * b.from[1] + 2 * u * ease * cy + ease * ease * b.to[1]
      ];
    };

    // Queue one shipment as up to 5 coalesced boxes (n units -> min(n,5) 📦),
    // 90 ms apart. Only animates when the destination is near the viewport —
    // off-camera deliveries still happen, they just aren't drawn.
    const spawnBoxes = (from, to, units, dur) => {
      if (!pixiApp || !boxRoot || !map) return;
      const n = Math.max(1, Math.min(5, units));
      const w = pixiApp.screen.width, h = pixiApp.screen.height, pad = 200;
      const p = map.project([to[0], to[1]]);
      if (p.x < -pad || p.y < -pad || p.x > w + pad || p.y > h + pad) return;
      const now = performance.now();
      for (let i = 0; i < n; i++) {
        boxes.push({ from: [from[0], from[1]], to: [to[0], to[1]],
          start: now + i * BOX_STAGGER_MS, dur, view: null });
      }
      while (boxes.length > MAX_BOXES) {
        const oldest = boxes.shift();                // drop the most-finished first
        if (oldest.view) oldest.view.destroy();
      }
    };

    // The single seam between the boxes subsystem and how a box LOOKS.
    // Primary: the 32x32 pixel-art crate inlined by build-machines-data.mjs
    // (nearest-neighbour, integer-scaled so it stays crisp). Fallback: the
    // 📦 emoji text when the asset is absent.
    const BOX_VISUALS = {
      make: () => {
        if (boxTexture) {
          const s = new PIXI.Sprite(boxTexture);
          s.anchor.set(0.5);
          // Integer scale only — pixel art must never blur or shimmer.
          s.scale.set(Math.max(1, Math.round((BOX_FONT_PX + 6) / boxTexture.height)));
          return s;
        }
        const t = new PIXI.Text({ text: '📦', style: { fontSize: BOX_FONT_PX } });
        t.anchor.set(0.5);
        return t;
      }
    };

    // Per-frame: advance boxes, project to screen space, cull off-screen.
    const renderBoxes = () => {
      if (!pixiApp || !boxRoot) return;
      const now = performance.now();
      const w = pixiApp.screen.width, h = pixiApp.screen.height;
      for (let i = boxes.length - 1; i >= 0; i--) {
        const b = boxes[i];
        if (now > b.start + b.dur) {
          if (b.view) b.view.destroy();
          boxes.splice(i, 1);
          continue;
        }
        if (now < b.start) continue;                 // staggered — not launched yet
        const [lng, lat] = boxPointAt(b, now);
        const p = map.project([lng, lat]);
        const on = p.x >= -40 && p.y >= -40 && p.x <= w + 40 && p.y <= h + 40;
        if (!b.view) {
          if (!on) continue;                         // create the view lazily
          b.view = BOX_VISUALS.make();
          boxRoot.addChild(b.view);
        }
        b.view.visible = on;
        if (on) b.view.position.set(p.x, p.y);
      }
    };

    (async () => {
      try {
        pixiApp = new PIXI.Application();
        await pixiApp.init({
          backgroundAlpha: 0,
          resizeTo: document.getElementById('map'),
          antialias: false,   // pixel art must not be smoothed
          resolution: 1
        });
        document.getElementById('pixi-overlay').appendChild(pixiApp.canvas);

        const asset = window.MACHINE_ASSETS && window.MACHINE_ASSETS.conveyor;
        if (asset) {
          const base = await PIXI.Assets.load(asset.image);   // data URI -> Texture
          base.source.scaleMode = 'nearest';                   // crisp pixel art
          beltFrames = asset.frames.map((f) => new PIXI.Texture({
            source: base.source,
            frame: new PIXI.Rectangle(f.x, f.y, asset.frameWidth, asset.frameHeight)
          }));
        } else {
          console.warn('machines-data.js missing — conveyor belts disabled');
        }

        interiorRoot = new PIXI.Container();
        pixiApp.stage.addChild(interiorRoot);   // interiors render below belts
        beltRoot = new PIXI.Container();
        pixiApp.stage.addChild(beltRoot);
        boxRoot = new PIXI.Container();
        pixiApp.stage.addChild(boxRoot);

        // Crate sprite from machines-data.js: present -> boxes render from it
        // (nearest-neighbour); absent -> BOX_VISUALS falls back to the 📦 emoji.
        const boxAsset = window.MACHINE_ASSETS && window.MACHINE_ASSETS.box;
        if (boxAsset && boxAsset.image) {
          const tex = await PIXI.Assets.load(boxAsset.image);
          tex.source.scaleMode = 'nearest';
          boxTexture = tex;
        }

        pixiApp.ticker.add(() => renderInteriors());
        pixiApp.ticker.add(() => renderBelts());
        pixiApp.ticker.add(() => renderBoxes());
      } catch (err) {
        console.warn('PixiJS overlay failed to initialise:', err);
      }
    })();
  });

  // ---- Scrolling: MapLibre default wheel-zoom behaviour ----
  // (native smoothed zoom — no custom handler)

  // ---- Smoother panning: gentler drag inertia ----
  try { map.dragPan.enable({ maxSpeed: 1.6, deceleration: 2500 }); } catch (_) {}

  // Controls
  map.addControl(new maplibregl.NavigationControl({
    showCompass: false,     // no compass = no rotate/pitch control
    visualizePitch: false
  }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }));

  // Marker on the town centre
  new maplibregl.Marker({ color: '#d9534f' })
    .setLngLat(CHATTERIS)
    .setPopup(new maplibregl.Popup({ offset: 24 }).setText('Chatteris'))
    .addTo(map);
</script>

</body>
</html>
