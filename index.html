<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatteris — 2D Map (MapLibre + OpenFreeMap)</title>

  <!-- Turf.js geospatial analysis -->
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>

  <!-- Chatteris OSM building data (fetched once from Overpass) -->
  <script src="buildings-data.js"></script>

  <!-- Machine sprites (Piskel conveyor, base64-inlined by build-machines-data.mjs) -->
  <script src="machines-data.js"></script>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- PixiJS (conveyor-belt rendering inside buildings) -->
  <script src="https://unpkg.com/pixi.js@8.6.6/dist/pixi.min.js"></script>

  <style>
    /* ==========================================================
       UI design system — see designrules.md
       Flat solid panels · thin hard border on everything ·
       exactly ONE hard drop-shadow · hard edges (radius 0) ·
       chunky high-contrast buttons · no translucency anywhere.
       Panel colours are dark ink so they separate from the light
       OSM basemap at any zoom; the accent colours are the same
       ones the building footprints use on the map, lifted a
       little where they need to read on a dark fill.
       ========================================================== */
    :root {
      --panel:      #171b21;   /* every panel body */
      --panel-2:    #212832;   /* button face / inset rows */
      --panel-3:    #2b333f;   /* button hover */
      --edge:       #080a0d;   /* the hard border, used everywhere */
      --rule:       #2f3742;   /* internal hairline dividers */
      --text:       #eeebe4;
      --dim:        #98a2ae;
      --cash:       #5ec46a;
      --alert:      #e0533f;
      --hot:        #ff8a4d;
      /* class colours — map hex, lifted for dark UI where needed */
      --factory:    #f5a623;
      --warehouse:  #7c9ccb;
      --office:     #a98ce0;
      --hq:         #e6b422;
      --company:    #3fbcaa;
      --shadow:     0 3px 0 rgba(0, 0, 0, 0.5);   /* the one shadow */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #map { position: absolute; inset: 0; }
    #pixi-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* clicks pass through to the map */
      z-index: 0;             /* above map canvas, below UI panels */
    }

    /* ---------- panel primitive ---------- */
    .panel {
      position: absolute;
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--edge);
      border-radius: 0;
      box-shadow: var(--shadow);
    }

    /* ---------- buttons ---------- */
    .btn {
      -webkit-appearance: none;
      appearance: none;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
      background: var(--panel-2);
      border: 2px solid var(--edge);
      border-bottom-width: 4px;   /* the chunk: a solid bottom edge, not a shadow */
      border-radius: 0;
      padding: 7px 10px 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--panel-3); }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .btn:disabled {
      color: #6b7580;
      background: #1b2129;
      cursor: not-allowed;
    }
    .btn--cash   { background: var(--cash);  color: #07160a; }
    .btn--cash:hover:not(:disabled)   { background: #6fd97b; }
    .btn--class  { color: #0b0e12; }                 /* fill set inline per class */
    .btn--class:hover:not(:disabled)  { filter: brightness(1.12); }
    .btn--sm     { font-size: 11px; padding: 6px 8px 5px; }
    .btn--wide   { display: block; width: 100%; text-align: center; white-space: normal; line-height: 1.25; }
    .btn.confirm { background: var(--alert); color: #1b0703; }   /* reset, armed */
    .btn.confirm:hover { background: #ef6651; }

    /* ---------- slim top HUD: global state only ---------- */
    #hud {
      top: 12px;
      left: 12px;
      z-index: 5;
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
      font-size: 13px;
      line-height: 1;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 11px;
      border-right: 1px solid var(--rule);
    }
    .hud-item:last-child { border-right: 0; }
    .hud-label { color: var(--dim); font-size: 11px; font-weight: 600; }
    .hud-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .hud-place { font-weight: 700; }
    .hud-place .mark { color: var(--hq); margin-right: 5px; }
    #wallet-balance  { color: var(--cash); }
    #product-count.full { color: var(--alert); }
    #owned-breakdown { color: var(--dim); font-size: 11px; font-weight: 600; }
    #tick-count { color: var(--dim); font-variant-numeric: tabular-nums; }
    .hud-actions { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
    #market-toggle[data-hot="1"] { background: var(--company); color: #04231f; }
    #market-toggle[data-hot="1"]:hover { filter: brightness(1.12); }

    /* ---------- shared popover innards ---------- */
    .pop-title {
      margin: -10px -10px 8px;
      padding: 9px 10px;
      background: var(--panel);
      border-bottom: 2px solid var(--edge);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pop-sub { color: var(--dim); font-size: 11px; font-weight: 600; }
    .row { color: var(--dim); font-size: 12px; margin: 5px 0; }
    .row strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .badge {
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #0b0e12;
      border: 2px solid var(--edge);
      white-space: nowrap;
    }
    .note {
      margin: 8px -10px -10px;
      padding: 8px 10px;
      background: var(--panel-2);
      border-top: 2px solid var(--edge);
      color: var(--dim);
      font-size: 11px;
    }

    /* ---------- building popover (anchored to the building) ---------- */
    .building-menu {
      z-index: 7;
      width: min(272px, calc(100vw - 24px));
      padding: 10px;
      font-size: 13px;
      display: none;
    }
    /* tail points back at the building that opened it */
    .building-menu::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--panel);
      border-left: 2px solid var(--edge);
      border-top: 2px solid var(--edge);
      transform: rotate(45deg);
    }
    .building-menu.from-tl::after { top: -8px; left: 16px; }
    .building-menu.from-tr::after { top: -8px; right: 16px; }
    .building-menu.from-bl::after { bottom: -8px; left: 16px; transform: rotate(225deg); }
    .building-menu.from-br::after { bottom: -8px; right: 16px; transform: rotate(225deg); }

    .cls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 0;
      border-top: 1px solid var(--rule);
    }
    .pop-title + .cls-row, .pop-actions + .cls-row { border-top: 0; }
    .cls-name { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .cls-dot { width: 10px; height: 10px; border: 2px solid var(--edge); flex: none; }
    .cls-note { color: var(--dim); font-size: 11px; font-weight: 400; margin-top: 3px; }
    .stack > .btn { margin-top: 6px; }
    .pop-actions { margin-bottom: 9px; }

    /* ---------- market popover (anchored to the HUD button) ---------- */
    .market-panel {
      z-index: 6;
      width: min(330px, calc(100vw - 24px));
      max-height: min(58vh, 520px);
      overflow-y: auto;
      padding: 10px;
      font-size: 13px;
      display: none;
    }
    .market-panel .pop-title { position: sticky; top: -10px; z-index: 1; }
    .market-row { border-top: 1px solid var(--rule); padding: 9px 0 8px; }
    .pop-title + .market-row, .pop-actions + .market-row { border-top: 0; }
    .market-name { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .market-row.hot .market-name { color: var(--hot); }
    .co-badge { background: var(--company); }
    .market-sector { color: var(--dim); font-size: 11px; font-weight: 600; }
    .market-stats { color: var(--dim); font-size: 12px; margin: 5px 0 7px; font-variant-numeric: tabular-nums; }
    .market-stats strong { color: var(--text); }
    .market-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .market-empty { color: var(--dim); font-size: 12px; padding: 4px 0 2px; }

    /* ---------- one-off hint, retires itself ---------- */
    #hint {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--dim);
    }
    #hint b { color: var(--text); }

    /* ---------- MapLibre chrome, matched to the panels ---------- */
    .maplibregl-popup-content {
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--edge);
      border-radius: 0;
      box-shadow: var(--shadow);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .maplibregl-popup-content small { color: var(--dim); font-weight: 500; }
    .maplibregl-popup-close-button {
      color: var(--dim);
      background: transparent;
      font-size: 15px;
      padding: 0 7px;
    }
    .maplibregl-popup-close-button:hover { background: var(--panel-2); color: var(--text); }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-top-right .maplibregl-popup-tip { border-bottom-color: var(--edge); }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip { border-top-color: var(--edge); }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--edge); }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--edge); }

    .maplibregl-ctrl-group {
      background: var(--panel);
      border: 2px solid var(--edge);
      border-radius: 0;
      box-shadow: var(--shadow);
    }
    .maplibregl-ctrl-group button { width: 32px; height: 32px; background: var(--panel); }
    .maplibregl-ctrl-group button:hover { background: var(--panel-3); }
    .maplibregl-ctrl-group button + button { border-top: 1px solid var(--rule); }
    .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(90%); }
    .maplibregl-ctrl-scale {
      background: var(--panel);
      color: var(--text);
      border: 2px solid var(--edge);
      border-top: none;
      border-radius: 0;
      font-size: 11px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }
    .maplibregl-ctrl-attrib {
      background: var(--panel) !important;
      border: 2px solid var(--edge);
      border-radius: 0 !important;
      color: var(--dim);
      font-size: 10px;
    }
    .maplibregl-ctrl-attrib a { color: var(--dim); }
    .maplibregl-ctrl-attrib-button { filter: invert(90%); }

    @media (prefers-reduced-motion: reduce) {
      .btn:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Slim top HUD — global state only. Anything about a specific building
     lives in a popover anchored to that building. -->
<div class="panel" id="hud">
  <div class="hud-item hud-place"><span class="mark">⚑</span>Chatteris</div>
  <div class="hud-item">
    <span class="hud-label">Cash</span>
    <span class="hud-value" id="wallet-balance">$100,000</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">Stock</span>
    <span class="hud-value" id="product-count">0 / 50</span>
  </div>
  <div class="hud-item">
    <span class="hud-label">Sites</span>
    <span class="hud-value" id="owned-count">0</span>
    <span id="owned-breakdown"></span>
  </div>
  <div class="hud-item">
    <span class="hud-label">Tick</span>
    <span class="hud-value" id="tick-count">10s</span>
  </div>
  <div class="hud-item hud-actions">
    <button class="btn btn--sm" id="market-toggle" title="Companies buying your products in view">Market <span id="market-count">0</span></button>
    <button class="btn btn--sm" id="reset-game" title="Clear all owned buildings and restore balance">Reset</button>
  </div>
</div>

<div class="panel building-menu" id="building-menu"></div>
<div class="panel market-panel" id="market-panel"></div>
<div class="panel" id="hint">Right-click a building to buy it — your first purchase is your <b>headquarters</b>.</div>
<div id="pixi-overlay"></div>

<script>
  // Chatteris town centre
  const CHATTERIS = [0.05030011035594765, 52.45514770133596];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty', // free OpenFreeMap tiles
    center: CHATTERIS,
    zoom: 14,

    // ---- Lock the map to 2D ----
    pitch: 0,
    bearing: 0,
    maxPitch: 0,            // no tilting possible
    dragRotate: false,      // no right-drag / ctrl-drag rotation
    touchZoomRotate: true,  // keep pinch zoom...
    hash: false
  });

  // Disable pinch-rotation (keep pinch-zoom working)
  if (map.touchZoomRotate) {
    map.touchZoomRotate.disableRotation();
  }

  // Repeatedly force bearing/pitch back to 0 if anything tries to change them
  map.on('pitch', () => { if (map.getPitch() !== 0) map.setPitch(0); });
  map.on('rotate', () => { if (map.getBearing() !== 0) map.resetNorth(); });

  map.on('load', () => {
    // Remove any 3D building layer that might exist in the style
    const layers = map.getStyle().layers || [];
    for (const layer of layers) {
      const id = layer.id.toLowerCase();
      const source = (layer.source || '').toLowerCase();
      if (
        (id.includes('building') && id.includes('3d')) ||
        id.includes('building-3d') ||
        source.includes('building-3d')
      ) {
        map.removeLayer(layer.id);
      }
    }

    // ---- OSM building footprints (flat 2D, from Overpass data) ----
    // The OpenFreeMap tiles generalize buildings heavily at their max zoom (z14),
    // so individual footprints are loaded from a one-time Overpass API export
    // (see fetch-buildings.mjs) and rendered as a local GeoJSON source.
    map.addSource('osm-buildings', {
      type: 'geojson',
      data: window.BUILDINGS_DATA,
      promoteId: 'id'   // each feature gets a stable id like 'w123456' (its OSM way id)
    });

    // Highlight source: holds at most ONE feature (the hovered building),
    // so it stays cheap no matter how many buildings are on screen.
    map.addSource('building-highlight', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    // Flat footprint fill — owned buildings get their class colour via feature-state
    map.addLayer({
      id: 'osm-buildings-fill',
      type: 'fill',
      source: 'osm-buildings',
      paint: {
        // NPC-company buildings (feature-state co=1) render teal; owned
        // buildings get their class colour; everything else stays neutral.
        'fill-color': [
          'case', ['==', ['feature-state', 'co'], 1], '#2f9e8f',
          ['match', ['feature-state', 'cls'],
            'factory', '#f5a623',    // amber
            'warehouse', '#5c7aa8',  // slate blue
            'office', '#8e6cc9',     // violet
            'hq', '#e6b422',         // gold
            '#d6cfc7'                // unowned
          ]
        ],
        // Owned buildings (feature-state `cls` set) fade out from z16 so the
        // PixiJS pixel-art interior can take over the footprint; unowned and
        // NPC-company buildings keep the original ramp exactly (0.825 at z16
        // on the old curve, 0.9 from z17). Note: this can't be done with a
        // second fill layer — MapLibre filters don't support feature-state —
        // and only one zoom interpolate/step is allowed per expression, so
        // the fade is one zoom interpolation whose stop VALUES are the
        // data-driven `case` expressions below.
        'fill-opacity': [
          'interpolate', ['linear'], ['zoom'],
          13, ['case', ['!=', ['coalesce', ['feature-state', 'cls'], ''], ''], 0.35, 0.35],
          15, ['case', ['!=', ['coalesce', ['feature-state', 'cls'], ''], ''], 0.75, 0.75],
          16, ['case', ['!=', ['coalesce', ['feature-state', 'cls'], ''], ''], 0.70, 0.825],
          17, ['case', ['!=', ['coalesce', ['feature-state', 'cls'], ''], ''], 0.20, 0.90],
          18, ['case', ['!=', ['coalesce', ['feature-state', 'cls'], ''], ''], 0.00, 0.90]
        ],
        'fill-outline-color': [
          'case', ['==', ['feature-state', 'co'], 1], '#1f6e63',
          ['match', ['feature-state', 'cls'],
            'factory', '#b57400',
            'warehouse', '#3c5578',
            'office', '#5e469b',
            'hq', '#a88000',
            '#a99e93'
          ]
        ]
      }
    });

    // Highlight layer drawn on top of the fill
    map.addLayer({
      id: 'building-highlight-layer',
      type: 'fill',
      source: 'building-highlight',
      paint: {
        'fill-color': [
          'case', ['==', ['get', 'co'], 1], '#5cc4b5',   // company hover (lighter teal)
          ['match', ['get', 'cls'],
            'factory', '#ffc04d',
            'warehouse', '#8fa9cf',
            'office', '#b39ddb',
            'hq', '#ffd54f',
            '#ff8f5e'   // unowned hover
          ]
        ],
        'fill-opacity': 0.65,
        'fill-outline-color': [
          'case', ['==', ['get', 'co'], 1], '#1f6e63',
          ['match', ['get', 'cls'],
            'factory', '#b57400',
            'warehouse', '#3c5578',
            'office', '#5e469b',
            'hq', '#a88000',
            '#e5561f'
          ]
        ]
      }
    });

    // Selection outline: marks the one building whose popover is open, so the
    // panel reads as belonging to that footprint rather than floating over the
    // map. Dark casing + light line so it survives any terrain underneath.
    map.addSource('menu-target', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    map.addLayer({
      id: 'menu-target-casing',
      type: 'line',
      source: 'menu-target',
      paint: { 'line-color': '#080a0d', 'line-width': 6 }
    });
    map.addLayer({
      id: 'menu-target-line',
      type: 'line',
      source: 'menu-target',
      paint: { 'line-color': '#ffffff', 'line-width': 2 }
    });
    const setMenuTarget = (geometry) => {
      map.getSource('menu-target').setData(geometry
        ? { type: 'Feature', geometry, properties: {} }
        : { type: 'FeatureCollection', features: [] });
    };

    // ---- Building classes & ownership system (persisted in localStorage) ----
    // `color` paints the footprint on the map; `uiColor` is the same hue
    // lifted where it needs to read as a button fill on the dark panels
    // (see the palette block in <style>). Map and UI stay one colour language.
    const BUILDING_CLASSES = {
      factory:   { label: 'Factory',      icon: '🏭', color: '#f5a623', uiColor: '#f5a623', costMult: 1.0,
                   m2PerLine: 50, lineCost: 2500, outputPerTick: 1, belt: true,
                   desc: 'Produces products' },
      warehouse: { label: 'Warehouse',    icon: '📦', color: '#5c7aa8', uiColor: '#7c9ccb', costMult: 0.6,
                   m2PerProduct: 4,
                   desc: 'Stores products' },
      office:    { label: 'Office',       icon: '🏢', color: '#8e6cc9', uiColor: '#a98ce0', costMult: 1.5,
                   cashPerM2PerTick: 0.5,
                   desc: 'Earns cash every tick' },
      hq:        { label: 'Headquarters', icon: '⚑', color: '#e6b422', uiColor: '#e6b422', costMult: 2.0,
                   unique: true, globalBonus: 0.10,
                   desc: '+10% production, office income and sale prices' }
    };

    const OWNED_KEY = 'chatteris-owned';
    const HQ_KEY = 'chatteris-hq';
    const LEGACY_CLAIMS_KEY = 'chatteris-claims';
    const LEGACY_FACTORIES_KEY = 'chatteris-factories';

    // Load ownership, migrating any pre-class save file once (non-destructive:
    // legacy keys stay in storage but are never read again after migration —
    // the OLDEST claim becomes the headquarters, the rest become factories,
    // and legacy factory-line counts carry over).
    const loadOwned = () => {
      const raw = localStorage.getItem(OWNED_KEY);
      if (raw) {
        try { return new Map(Object.entries(JSON.parse(raw))); } catch (_) { return new Map(); }
      }
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_CLAIMS_KEY) || '{}');
        const lines = JSON.parse(localStorage.getItem(LEGACY_FACTORIES_KEY) || '{}');
        const entries = Object.entries(legacy).sort((a, b) => a[1] - b[1]);
        const migrated = new Map();
        let firstHqId = null;
        for (const [id, ts] of entries) {
          const cls = firstHqId === null ? 'hq' : 'factory';
          if (cls === 'hq') firstHqId = id;
          migrated.set(id, { cls, ts, lines: Number(lines[id]) || 0 });
        }
        if (firstHqId !== null) localStorage.setItem(HQ_KEY, firstHqId);
        return migrated;
      } catch (_) { return new Map(); }
    };

    const owned = loadOwned();

    // Police the persisted HQ id: it must point at a currently-owned HQ record.
    let hqId = null;
    const candidateHq = localStorage.getItem(HQ_KEY);
    if (candidateHq && owned.has(candidateHq) && owned.get(candidateHq).cls === 'hq') {
      hqId = candidateHq;
    } else {
      localStorage.removeItem(HQ_KEY);
    }

    const saveOwned = () => {
      localStorage.setItem(OWNED_KEY, JSON.stringify(Object.fromEntries(owned)));
    };
    const saveHq = () => {
      if (hqId === null) localStorage.removeItem(HQ_KEY);
      else localStorage.setItem(HQ_KEY, hqId);
    };

    const ownedCountEl = document.getElementById('owned-count');
    const ownedBreakdownEl = document.getElementById('owned-breakdown');
    const updateOwnedDisplay = () => {
      ownedCountEl.textContent = owned.size;
      const parts = [];
      for (const [key, cfg] of Object.entries(BUILDING_CLASSES)) {
        if (cfg.unique) {
          if (hqId !== null) parts.push('⚑ HQ');
          continue;
        }
        let n = 0;
        for (const r of owned.values()) if (r.cls === key) n++;
        if (n > 0) parts.push(`${cfg.label[0]}${n}`);   // e.g. F3 · W1 · O2
      }
      ownedBreakdownEl.textContent = parts.length ? parts.join(' · ') : '';
    };
    updateOwnedDisplay();

    // ---- Wallet / currency system ($10 per m² of footprint) ----
    const WALLET_KEY = 'chatteris-wallet';
    const PRICE_PER_M2 = 10;
    const STARTING_BALANCE = 100000;

    const loadWallet = () => {
      const v = Number(localStorage.getItem(WALLET_KEY));
      return Number.isFinite(v) ? v : STARTING_BALANCE;
    };
    const saveWallet = () => {
      localStorage.setItem(WALLET_KEY, String(wallet));
    };
    const walletEl = document.getElementById('wallet-balance');
    const updateWalletDisplay = () => {
      walletEl.textContent = '$' + wallet.toLocaleString();
    };

    let wallet = loadWallet();
    updateWalletDisplay();

    // Building prices (area × $10/m² × class cost multiplier), memoized by id|cls
    const priceCache = new Map();
    const buildingPrice = (f, cls) => {
      const key = `${f.properties.id}|${cls}`;
      if (!priceCache.has(key)) {
        const mult = BUILDING_CLASSES[cls] ? BUILDING_CLASSES[cls].costMult : 1;
        priceCache.set(key, Math.round(turf.area(f.geometry) * PRICE_PER_M2 * mult));
      }
      return priceCache.get(key);
    };

    // Footprint area in m², memoized by id (used for office income)
    const areaCache = new Map();
    const areaOf = (id, geometry) => {
      if (!areaCache.has(id)) areaCache.set(id, turf.area(geometry));
      return areaCache.get(id);
    };

    // ---- Production system (factory lines + products + office income) ----
    const PRODUCTS_KEY = 'chatteris-products';   // legacy scalar total (migrated from, never rewritten)
    const STOCK_KEY = 'chatteris-stock';         // per-holder stock: { holderId: units }
    const TICK_MS = 10000;         // one production tick every 10s
    const BASE_STORAGE = 50;       // free loading-yard storage before any warehouse
    const YARD_ID = '__yard';      // virtual yard holder — always exists, cap = BASE_STORAGE

    let products = 0;              // scalar total of `stock` (kept: HUD / market / menu seam)
    const stock = new Map();       // holder id -> units (holders at 0 are pruned)

    const productsEl = document.getElementById('product-count');
    const updateProductDisplay = () => {
      const cap = totalCapacity();
      productsEl.textContent = `${products.toLocaleString()} / ${cap.toLocaleString()}`;
      productsEl.classList.toggle('full', products >= cap);
    };

    // Factory output multiplier: the HQ adds +10% (warehouses no longer boost
    // production — they provide storage instead).
    const factoryOutputMult = () =>
      (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1);

    // Storage cap: a free loading yard plus warehouse area. Each warehouse
    // stores floor(area / m2PerProduct) products (areaOf is memoized, and the
    // owned set is small, so recomputing on demand is cheap).
    const warehouseStorage = (area) =>
      Math.floor(area / BUILDING_CLASSES.warehouse.m2PerProduct);
    const totalCapacity = () => {
      let n = BASE_STORAGE;
      for (const [id, rec] of owned) {
        if (rec.cls !== 'warehouse') continue;
        const geom = geometryFor(id);
        if (geom) n += warehouseStorage(areaOf(id, geom));
      }
      return n;
    };

    // Line capacity: footprint area (m² per line from the class registry),
    // clamped to the number of belt modules that physically fit inside the
    // footprint (memoized). See layoutFor().
    const capacityCache = new Map();
    const buildingCapacity = (id, geometry, cls = 'factory') => {
      const key = `${id}|${cls}`;
      if (!capacityCache.has(key)) {
        const m2PerLine = (BUILDING_CLASSES[cls] && BUILDING_CLASSES[cls].m2PerLine) ||
                          BUILDING_CLASSES.factory.m2PerLine;
        const areaCap = Math.max(1, Math.floor(turf.area(geometry) / m2PerLine));
        const slotCap = layoutFor(id, geometry).slots.length;
        capacityCache.set(key, Math.max(1, Math.min(areaCap, slotCap)));
      }
      return capacityCache.get(key);
    };

    // ---- Footprint access seam (world-scalable data path) ----
    // Today this is backed by the single Chatteris dataset (index built once,
    // lazily). The follow-up refactor swaps these internals for a cell-bucket
    // spatial index over chunked region data WITHOUT touching any call site:
    // all gameplay code goes through all()/featureById()/geometryFor() only.
    const Footprints = (() => {
      let features = [];
      let byId = null;
      const index = () => {
        if (byId) return;
        features = (window.BUILDINGS_DATA && window.BUILDINGS_DATA.features) || [];
        byId = new Map();
        for (const f of features) {
          if (f.properties && f.properties.id) byId.set(f.properties.id, f);
        }
      };
      const featureById = (id) => { index(); return byId.get(id) || null; };
      return {
        all: () => { index(); return features; },
        featureById,
        geometryFor: (id) => { const f = featureById(id); return f ? f.geometry : null; }
      };
    })();
    const geometryFor = Footprints.geometryFor;

    // ---- Per-building stock (warehouses + virtual yard) ----
    // Stock lives per holder: each warehouse holds up to its own capacity and
    // the yard (YARD_ID) holds BASE_STORAGE. The scalar `products` is always
    // totalStock() — kept so the HUD, market panel and menus read one number.
    const stockIn = (id) => stock.get(id) || 0;
    const setStock = (id, n) => { if (n > 0) stock.set(id, n); else stock.delete(id); };
    const totalStock = () => { let n = 0; for (const v of stock.values()) n += v; return n; };
    const saveStock = () => localStorage.setItem(STOCK_KEY, JSON.stringify(Object.fromEntries(stock)));
    const capacityOf = (holderId) => {
      if (holderId === YARD_ID) return BASE_STORAGE;
      const rec = owned.get(holderId);
      if (!rec || rec.cls !== 'warehouse') return 0;
      const geom = geometryFor(holderId);
      return geom ? warehouseStorage(areaOf(holderId, geom)) : 0;
    };
    const freeRoom = (id) => capacityOf(id) - stockIn(id);
    const syncProducts = () => {
      products = totalStock();
      saveStock();
      updateProductDisplay();
    };

    // Owned warehouse ids sorted by squared distance to `center` ([lng,lat]);
    // insertion order when no centre is given (legacy migration).
    const warehousesNear = (center) => {
      const out = [];
      for (const [id, rec] of owned) {
        if (rec.cls !== 'warehouse') continue;
        const geom = geometryFor(id);
        if (!geom) continue;
        if (!center) { out.push([0, id]); continue; }
        const c = centroidOf(geom);
        const cosLat = Math.cos((center[1] + c[1]) / 2 * Math.PI / 180) * 111320;
        const dx = (c[0] - center[0]) * cosLat;
        const dy = (c[1] - center[1]) * 111320;
        out.push([dx * dx + dy * dy, id]);
      }
      out.sort((a, b) => a[0] - b[0]);
      return out.map((x) => x[1]);
    };

    // Place n units near `center`: warehouses nearest-first with room, then
    // the yard (the overflow bin). Returns { placed, legs: [{holderId, n}] }.
    // Production passes the factory's centroid; selling a warehouse passes the
    // sold building's centroid (its stock spills through the same path).
    const allocateStock = (n, center) => {
      const legs = [];
      let left = n;
      for (const id of warehousesNear(center)) {
        if (left <= 0) break;
        const take = Math.min(left, freeRoom(id));
        if (take > 0) { setStock(id, stockIn(id) + take); left -= take; legs.push({ holderId: id, n: take }); }
      }
      if (left > 0 && freeRoom(YARD_ID) > 0) {
        const take = Math.min(left, freeRoom(YARD_ID));
        setStock(YARD_ID, stockIn(YARD_ID) + take);
        left -= take;
        legs.push({ holderId: YARD_ID, n: take });
      }
      return { placed: n - left, legs };
    };

    // Remove up to n units for a buyer at `center`: warehouses nearest the
    // buyer drain first, the yard last. Returns { taken, legs: [{holderId, n}] }.
    const drainStock = (n, center) => {
      const legs = [];
      let left = n;
      for (const id of [...warehousesNear(center), YARD_ID]) {
        if (left <= 0) break;
        const take = Math.min(left, stockIn(id));
        if (take > 0) { setStock(id, stockIn(id) - take); left -= take; legs.push({ holderId: id, n: take }); }
      }
      return { taken: n - left, legs };
    };

    // ---- Load / migrate stock ----
    // Per-holder stock lives under STOCK_KEY. A legacy scalar total (the old
    // PRODUCTS_KEY) is distributed once — warehouses first, yard last, clamped
    // by real capacities; the legacy key is left in place (non-destructive,
    // same policy as the claims migration).
    (() => {
      let loaded = false;
      try {
        const raw = localStorage.getItem(STOCK_KEY);
        if (raw !== null) {
          for (const [k, v] of Object.entries(JSON.parse(raw))) {
            const n = Number(v);
            if (Number.isFinite(n) && n > 0) stock.set(k, Math.floor(n));
          }
          loaded = true;
        }
      } catch (_) { stock.clear(); loaded = false; }
      if (!loaded) {
        const legacy = Math.max(0, Number(localStorage.getItem(PRODUCTS_KEY)) || 0);
        if (legacy > 0) allocateStock(legacy, null);
      }
      // Clamp to live capacities (buildings may have changed off-session;
      // stale holder ids have capacity 0 and vanish)
      for (const id of [...stock.keys()]) {
        if (stockIn(id) > capacityOf(id)) setStock(id, capacityOf(id));
      }
      products = totalStock();
      saveStock();
    })();
    updateProductDisplay();

    // ---- NPC company market ----
    // Companies are a PURE FUNCTION of each building's stable id (FNV-1a
    // hash), so they exist anywhere in the world without pre-generation or
    // storage: spawn at any location and the nearest buildings already have
    // deterministic companies. Only volatile state (price drift + remaining
    // demand) is held in memory, keyed by id, created on demand — memory
    // scales with companies near the camera, not the world.
    const MARKET = {
      DENSITY: 18,                         // 1-in-N candidate buildings host a company (tuned: 14 within 2 km of Chatteris)
      PRICE_MIN: 18, PRICE_SPAN: 23,      // base price per product: $18–$40 inclusive
      DRIFT_STEP: 0.08,                   // per-tick random drift step
      DRIFT_MAX: 0.25,                    // price clamped to ±25% of base
      HOT: 0.15,                          // 🔥 hot buyer marker above +15%
      AREA_MIN: 250, AREA_MAX: 4000,      // company footprint range (m²)
      RADIUS_M: 2000,                     // local roster radius around the camera
      DEMAND_MIN: 5, DEMAND_MAX: 60,      // per-tick demand clamps
      BUYOUT_PER_M2: 60                   // 4× the office price ($10/m² × costMult 1.5)
    };

    // FNV-1a 32-bit string hash — deterministic across sessions & platforms
    const hash32 = (str) => {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    };

    const SECTORS = ['Packaging', 'Food', 'Logistics', 'Electronics', 'Precision Eng.',
      'Retail', 'Agritech', 'Furniture', 'Chemicals', 'Printing'];

    // Flavour-name word lists per locale. Adding a region later is additive
    // data, not code; real OSM names win over generated ones when present.
    const NAME_LOCALES = {
      UK_EN: {
        A: ['Fenland', 'Whittlesey', 'Ely', 'March', 'Nene', 'Ramsey', 'Alder', 'Cedar',
          'Meadow', 'Stone', 'Harvest', 'Crown', 'Oakfield', 'Brook', 'Holt', 'Northern'],
        B: ['Packaging', 'Foods', 'Logistics', 'Engineering', 'Electronics', 'Agri',
          'Print', 'Textiles', 'Marketing', 'Consulting', 'Interiors', 'Chemical',
          'Dairy', 'Grain', 'Steel', 'Design'],
        S: [' Ltd', ' & Co', ' Group', ' PLC', ' Partners', '']
      }
    };
    const NAME_LOCALE = NAME_LOCALES.UK_EN;

    // Approximate footprint centre (ring average — only used for sorting)
    const centroidOf = (geometry) => {
      const ring = geometry.type === 'Polygon' ? geometry.coordinates[0]
        : (geometry.type === 'MultiPolygon' && geometry.coordinates.length ? geometry.coordinates[0][0] : null);
      if (!ring || !ring.length) return [0, 0];
      let x = 0, y = 0;
      for (const p of ring) { x += p[0]; y += p[1]; }
      return [x / ring.length, y / ring.length];
    };


    const companyCache = new Map();     // site id -> company | null (pure decision, memoized)
    const forcedCompanies = new Map();  // site id -> company (relocated there by a buyout)
    const marketState = new Map();      // site id -> { drift, demand, cap }

    // Deterministic per-building company decision. Null for owned buildings,
    // wrong-size footprints, and every building failing the density hash.
    const companyFor = (f) => {
      const id = f.properties && f.properties.id;
      if (!id || !f.geometry) return null;
      if (companyCache.has(id)) return companyCache.get(id);
      let co = null;
      if (!owned.has(id)) {
        if (forcedCompanies.has(id)) {
          co = forcedCompanies.get(id);
        } else {
          const area = areaOf(id, f.geometry);
          if (area >= MARKET.AREA_MIN && area <= MARKET.AREA_MAX &&
              hash32(id + ':site') % MARKET.DENSITY === 0) {
            const p = f.properties;
            const name = p.name || (
              NAME_LOCALE.A[hash32(id + ':a') % NAME_LOCALE.A.length] + ' ' +
              NAME_LOCALE.B[hash32(id + ':b') % NAME_LOCALE.B.length] +
              NAME_LOCALE.S[hash32(id + ':s') % NAME_LOCALE.S.length]);
            co = {
              id, name,
              sector: SECTORS[hash32(id + ':sector') % SECTORS.length],
              base: MARKET.PRICE_MIN + (hash32(id + ':price') % MARKET.PRICE_SPAN),
              area,
              centroid: centroidOf(f.geometry)
            };
          }
        }
      }
      companyCache.set(id, co);
      return co;
    };

    // Demand per tick: round(area/60) + 3, clamped 5–60; refilled every tick
    const demandCapFor = (area) =>
      Math.max(MARKET.DEMAND_MIN, Math.min(MARKET.DEMAND_MAX, Math.round(area / 60) + 3));

    const stateFor = (co) => {
      let s = marketState.get(co.id);
      if (!s) {
        const cap = demandCapFor(co.area);
        s = { drift: 0, demand: cap, cap };
        marketState.set(co.id, s);
      }
      return s;
    };

    // HQ bonus extends to sale prices (same +10% as production & office income)
    const hqSaleBonus = () => (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1);
    const companyPrice = (co, s) => Math.round(co.base * (1 + s.drift) * hqSaleBonus());

    // Market tick: random walk the drift (clamped ±25%), refill demand
    const tickMarket = () => {
      for (const s of marketState.values()) {
        s.drift = Math.max(-MARKET.DRIFT_MAX,
          Math.min(MARKET.DRIFT_MAX, s.drift + (Math.random() * 2 - 1) * MARKET.DRIFT_STEP));
        s.demand = s.cap;
      }
    };

    // Roster query: companies within radiusM of a centre (planar, cos-lat
    // scaled), nearest first. Against the Footprints seam — when the seam is
    // backed by a spatial index this stops scanning everything.
    const companiesNear = (center, radiusM) => {
      const out = [];
      const cosLat = Math.cos(center[1] * Math.PI / 180) * 111320;
      for (const f of Footprints.all()) {
        const co = companyFor(f);
        if (!co) continue;
        const dx = (co.centroid[0] - center[0]) * cosLat;
        const dy = (co.centroid[1] - center[1]) * 111320;
        const d2 = dx * dx + dy * dy;
        if (d2 <= radiusM * radiusM) out.push([d2, co]);
      }
      out.sort((a, b) => a[0] - b[0]);
      return out.map((x) => x[1]);
    };

    // Sell qty products to a company (clamped by remaining demand & stock).
    // Sourcing: warehouses nearest the buyer drain first, the yard last —
    // each contributing source animates a 📦 hop to the buyer.
    const sellTo = (co, qty) => {
      const s = stateFor(co);
      const n = Math.max(0, Math.min(qty, s.demand, products));
      if (n <= 0) return 0;
      const { taken, legs } = drainStock(n, co.centroid);
      const cash = taken * companyPrice(co, s);
      s.demand -= taken;
      wallet += cash;
      for (const leg of legs) {
        const g = leg.holderId === YARD_ID ? null : geometryFor(leg.holderId);
        const from = g ? centroidOf(g)
          : (hqId !== null && geometryFor(hqId) ? centroidOf(geometryFor(hqId)) : null);
        // Yard shipments leave from the HQ (the yard's visual anchor); with no
        // HQ either, skip the animation rather than fake an origin.
        if (from) spawnBoxes(from, co.centroid, leg.n, BOX_SALE_MS);
      }
      syncProducts();
      saveWallet();
      updateWalletDisplay();
      return cash;
    };

    // Greedy fill: sell everything to the highest-paying companies first
    const sellAllBest = () => {
      let total = 0;
      const byPrice = [...marketRoster]
        .sort((a, b) => companyPrice(b, stateFor(b)) - companyPrice(a, stateFor(a)));
      for (const co of byPrice) {
        if (products <= 0) break;
        total += sellTo(co, stateFor(co).demand);
      }
      return total;
    };

    const companyBuyoutPrice = (co) => Math.round(co.area * MARKET.BUYOUT_PER_M2);

    // Buy the company's site: the building becomes a player-owned office and
    // the company relocates to the nearest unowned candidate site (keeping
    // its name, sector and base price — visible as the same company moving).
    const buyoutCompany = (co) => {
      const price = companyBuyoutPrice(co);
      if (wallet < price || owned.has(co.id)) return false;
      wallet -= price;
      owned.set(co.id, { cls: 'office', ts: Date.now(), lines: 0 });
      saveWallet();
      saveOwned();
      updateWalletDisplay();
      updateOwnedDisplay();
      try { map.removeFeatureState({ source: 'osm-buildings', id: co.id }, 'co'); } catch (_) {}
      applyOwnershipState(co.id, 'office');
      refreshInteriors();
      companyCache.set(co.id, null);
      marketState.delete(co.id);

      let best = null, bestD2 = Infinity;
      const cosLat = Math.cos(co.centroid[1] * Math.PI / 180) * 111320;
      for (const f of Footprints.all()) {
        const c2 = companyFor(f);
        if (!c2 || c2.id === co.id) continue;
        const dx = (c2.centroid[0] - co.centroid[0]) * cosLat;
        const dy = (c2.centroid[1] - co.centroid[1]) * 111320;
        const d2 = dx * dx + dy * dy;
        if (d2 < bestD2) { bestD2 = d2; best = c2; }
      }
      if (best) {
        forcedCompanies.set(best.id,
          { ...best, name: co.name, sector: co.sector, base: co.base });
        companyCache.delete(best.id);   // drop its cached hash-decision
      }
      refreshMarket();
      return true;
    };

    // ---- Selling buildings back ----
    // Buildings resell at SELL_BACK of their buy price. Selling a warehouse
    // spills its contents into the remaining storage (other warehouses
    // nearest-first, then the yard); only TRUE overflow past all remaining
    // capacity is auto-sold to the NEAREST NPC business (the roster is
    // nearest-first) at its current price — with no company nearby the excess
    // is scrapped silently. Selling the HQ clears the unique slot.
    const SELL_BACK = 0.5;
    const resalePrice = (id, geometry) => {
      const rec = owned.get(id);
      const cls = rec ? rec.cls : 'factory';
      const cfg = BUILDING_CLASSES[cls] || BUILDING_CLASSES.factory;
      return Math.round(areaOf(id, geometry) * PRICE_PER_M2 * cfg.costMult * SELL_BACK);
    };
    const sellBuilding = (id, geometry) => {
      const rec = owned.get(id);
      if (!rec || !geometry) return null;
      const cls = rec.cls;
      const refund = resalePrice(id, geometry);   // reads `rec` — before the delete below

      // Drop ownership FIRST so spill allocation never targets the sold
      // building itself.
      owned.delete(id);

      let liquidated = 0, liquidationCash = 0, buyerName = null;
      if (cls === 'warehouse') {
        const geom0 = geometryFor(id);
        const center = geom0 ? centroidOf(geom0) : null;
        const contents = stockIn(id);
        setStock(id, 0);
        let left = contents;
        if (left > 0) {
          const { placed, legs } = allocateStock(left, center);
          left -= placed;
          for (const leg of legs) {
            if (leg.holderId === YARD_ID) continue;      // virtual yard — no hop
            const wg = geometryFor(leg.holderId);
            if (wg && center) spawnBoxes(center, centroidOf(wg), leg.n, BOX_PROD_MS);
          }
        }
        if (left > 0) {
          liquidated = left;                             // true overflow only
          const buyer = marketRoster[0];
          if (buyer) {
            const s = stateFor(buyer);
            liquidationCash = Math.round(liquidated * companyPrice(buyer, s));
            s.demand = Math.max(0, s.demand - liquidated);
            buyerName = buyer.name;
            if (center) spawnBoxes(center, buyer.centroid, liquidated, BOX_SALE_MS);
          }
        }
        syncProducts();
      }

      if (hqId === id) { hqId = null; saveHq(); }
      saveOwned();
      wallet += refund + liquidationCash;
      saveWallet();
      try { map.removeFeatureState({ source: 'osm-buildings', id }, 'cls'); } catch (_) {}
      if (cls === 'factory') refreshBelts();
      refreshInteriors();
      updateOwnedDisplay();
      updateWalletDisplay();
      updateProductDisplay();
      if (marketPanelOpen) renderMarketPanel();
      return { refund, liquidated, liquidationCash, buyerName };
    };

    // ---- Roster <-> map feature states (teal `co: 1`), camera-driven ----
    let marketRoster = [];
    const appliedCoStates = new Set();
    const refreshMarket = () => {
      const c = map.getCenter();
      marketRoster = companiesNear([c.lng, c.lat], MARKET.RADIUS_M);
      for (const id of [...appliedCoStates]) {
        if (!marketRoster.some((co) => co.id === id)) {
          try { map.removeFeatureState({ source: 'osm-buildings', id }, 'co'); } catch (_) {}
          appliedCoStates.delete(id);
        }
      }
      for (const co of marketRoster) {
        if (!appliedCoStates.has(co.id)) {
          try { map.setFeatureState({ source: 'osm-buildings', id: co.id }, { co: 1 }); } catch (_) {}
          appliedCoStates.add(co.id);
        }
      }
      updateMarketButton();
      if (marketPanelOpen) renderMarketPanel();
    };

    // ---- Market panel UI ----
    const marketPanel = document.getElementById('market-panel');
    const marketToggleBtn = document.getElementById('market-toggle');
    const marketCountEl = document.getElementById('market-count');
    let marketPanelOpen = false;

    // designrules.md: only render UI for objects currently in the viewport.
    // The roster itself stays camera-radius scoped — it drives the teal map
    // fills and the overflow auto-sale — but the panel only lists buyers that
    // are actually on screen. Flip this to false to list the whole roster.
    const VIEWPORT_SCOPED_UI = true;
    const companiesInView = () => {
      if (!VIEWPORT_SCOPED_UI) return marketRoster;
      const b = map.getBounds();
      return marketRoster.filter((co) => b.contains(co.centroid));
    };

    // Anchor the popover under the button that opens it.
    const positionMarketPanel = () => {
      const hud = document.getElementById('hud').getBoundingClientRect();
      const btn = marketToggleBtn.getBoundingClientRect();
      const w = marketPanel.offsetWidth || 330;
      marketPanel.style.left = `${Math.max(12, Math.min(btn.left, window.innerWidth - 12 - w))}px`;
      marketPanel.style.top = `${hud.bottom + 8}px`;
    };

    const updateMarketButton = () => {
      const visible = companiesInView();
      marketCountEl.textContent = visible.length;
      // Teal button = at least one buyer on screen is paying over the odds
      const hot = visible.some((co) => {
        const s = marketState.get(co.id);
        return s && s.drift >= MARKET.HOT;
      });
      marketToggleBtn.dataset.hot = hot ? '1' : '0';
    };
    const escHtml = (t) => String(t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const trendArrow = (s) => (s.drift > 0.02 ? '▲' : s.drift < -0.02 ? '▼' : '—');

    const renderMarketPanel = () => {
      if (!marketPanelOpen) return;
      const rows = companiesInView().map((co) => {
        const s = stateFor(co);
        const price = companyPrice(co, s);
        const buyout = companyBuyoutPrice(co);
        const canSell = s.demand > 0 && products > 0;
        const hot = s.drift >= MARKET.HOT;
        return `
          <div class="market-row${hot ? ' hot' : ''}" data-co="${co.id}">
            <div class="market-name"><span class="badge co-badge">NPC</span>${escHtml(co.name)}${hot ? ' 🔥' : ''}<span class="market-sector">${escHtml(co.sector)}</span></div>
            <div class="market-stats"><strong>$${price}</strong> ${trendArrow(s)} per product · wants <strong>${s.demand}</strong> of ${s.cap}</div>
            <div class="market-actions">
              <button class="btn btn--sm btn--cash" data-sell="all" ${canSell ? '' : 'disabled'}>Sell all</button>
              <button class="btn btn--sm" data-sell="10" ${canSell ? '' : 'disabled'}>Sell 10</button>
              <button class="btn btn--sm" data-goto="1" title="Centre the map on this site">Show on map</button>
              <button class="btn btn--sm" data-buyout="1" title="Buy this site — the company relocates" ${wallet >= buyout ? '' : 'disabled'}>Buy site $${buyout.toLocaleString()}</button>
            </div>
          </div>`;
      }).join('');
      marketPanel.innerHTML = `
        <div class="pop-title">
          Buyers in view
          <span class="pop-sub">stock ${products.toLocaleString()} / ${totalCapacity().toLocaleString()}</span>
        </div>
        <div class="pop-actions">
          <button class="btn btn--wide btn--cash" id="market-sell-best" ${products > 0 ? '' : 'disabled'}>Sell everything to the best buyers nearby</button>
        </div>
        ${rows || '<div class="market-empty">No buyers on screen. Pan or zoom out to find companies.</div>'}`;
      marketPanel.querySelectorAll('button[data-goto]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const co = marketRoster.find((c) => c.id === btn.closest('.market-row').dataset.co);
          if (co) map.easeTo({ center: co.centroid, zoom: Math.max(map.getZoom(), 17) });
        });
      });
      marketPanel.querySelectorAll('button[data-sell]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const co = marketRoster.find((c) => c.id === btn.closest('.market-row').dataset.co);
          if (!co) return;
          sellTo(co, btn.dataset.sell === 'all' ? stateFor(co).demand : 10);
          renderMarketPanel();
        });
      });
      const bestBtn = marketPanel.querySelector('#market-sell-best');
      if (bestBtn) bestBtn.addEventListener('click', () => { sellAllBest(); renderMarketPanel(); });
      marketPanel.querySelectorAll('button[data-buyout]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const co = marketRoster.find((c) => c.id === btn.closest('.market-row').dataset.co);
          if (co && buyoutCompany(co)) renderMarketPanel();
        });
      });
    };

    marketToggleBtn.addEventListener('click', () => {
      marketPanelOpen = !marketPanelOpen;
      marketPanel.style.display = marketPanelOpen ? 'block' : 'none';
      if (marketPanelOpen) { renderMarketPanel(); positionMarketPanel(); }
    });
    window.addEventListener('resize', () => { if (marketPanelOpen) positionMarketPanel(); });

    // Keep the roster local to the camera: refresh (debounced) after pans.
    let marketMoveTimer = null;
    map.on('moveend', () => {
      clearTimeout(marketMoveTimer);
      marketMoveTimer = setTimeout(refreshMarket, 250);
    });
    refreshMarket();

    // The tick is the game's unit of time, so the HUD counts it down.
    const tickEl = document.getElementById('tick-count');
    let nextTickAt = Date.now() + TICK_MS;
    setInterval(() => {
      tickEl.textContent = `${Math.max(0, Math.ceil((nextTickAt - Date.now()) / 1000))}s`;
    }, 250);

    // Production tick: every 10s factories produce products and offices earn cash
    setInterval(() => {
      nextTickAt = Date.now() + TICK_MS;
      const mult = factoryOutputMult();
      for (const [id, rec] of owned) {
        if (rec.cls !== 'factory' || !rec.lines) continue;
        // Storage is a hard ceiling per holder: output goes to the nearest
        // warehouse with room, then the yard; nowhere has room -> not made.
        const made = Math.round(rec.lines * BUILDING_CLASSES.factory.outputPerTick * mult);
        if (made <= 0) continue;
        const geom = geometryFor(id);
        const from = geom ? centroidOf(geom) : null;
        const { legs } = allocateStock(made, from);
        for (const leg of legs) {
          if (leg.holderId === YARD_ID) continue;        // virtual yard — no hop
          const wg = geometryFor(leg.holderId);
          if (wg && from) spawnBoxes(from, centroidOf(wg), leg.n, BOX_PROD_MS);
        }
      }
      syncProducts();
      let officeCash = 0;
      for (const [id, rec] of owned) {
        if (rec.cls !== 'office') continue;
        const geom = geometryFor(id);
        if (!geom) continue;
        officeCash += areaOf(id, geom) * BUILDING_CLASSES.office.cashPerM2PerTick *
                      (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1);
      }
      if (officeCash >= 1) {
        wallet += Math.round(officeCash);
        saveWallet();
        updateWalletDisplay();
      }
      // Market tick rides along with production: drift prices, refill demand
      tickMarket();
      if (marketPanelOpen) renderMarketPanel();
    }, TICK_MS);

    // Apply persisted ownership to the map's feature states
    const applyOwnershipState = (id, cls) => {
      try { map.setFeatureState({ source: 'osm-buildings', id }, { cls }); } catch (_) {}
    };
    for (const [id, rec] of owned) applyOwnershipState(id, rec.cls);

    // Reset button — two-step confirm so the game isn't wiped accidentally
    const resetBtn = document.getElementById('reset-game');
    let confirmTimer = null;
    resetBtn.addEventListener('click', () => {
      if (!resetBtn.classList.contains('confirm')) {
        resetBtn.classList.add('confirm');
        resetBtn.textContent = 'Confirm?';
        confirmTimer = setTimeout(() => {
          resetBtn.classList.remove('confirm');
          resetBtn.textContent = 'Reset';
        }, 3000);
        return;
      }
      clearTimeout(confirmTimer);
      for (const id of owned.keys()) {
        try { map.removeFeatureState({ source: 'osm-buildings', id }, 'cls'); } catch (_) {}
      }
      owned.clear();
      hqId = null;
      saveOwned();
      saveHq();
      updateOwnedDisplay();
      wallet = STARTING_BALANCE;
      saveWallet();
      updateWalletDisplay();
      products = 0;
      stock.clear();
      for (const b of boxes) if (b.view) b.view.destroy();
      boxes.length = 0;
      localStorage.setItem(STOCK_KEY, '{}');
      localStorage.setItem(PRODUCTS_KEY, '0');
      updateProductDisplay();
      // Market state is volatile by design — a reset regenerates it cleanly
      marketState.clear();
      companyCache.clear();
      forcedCompanies.clear();
      for (const id of appliedCoStates) {
        try { map.removeFeatureState({ source: 'osm-buildings', id }, 'co'); } catch (_) {}
      }
      appliedCoStates.clear();
      refreshMarket();
      refreshBelts();
      refreshInteriors();
      resetBtn.classList.remove('confirm');
      resetBtn.textContent = 'Reset';
    });

    // ---- Interaction hooks (hover + click) ----
    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false,
      offset: 12
    });

    let hoveredGeom = null;

    const describeFeature = (f) => {
      const p = f.properties || {};
      const bits = [];
      if (p.name) bits.push(p.name);
      if (p.class && p.class !== 'yes') bits.push(String(p.class).replace(/_/g, ' '));
      if (p.height) bits.push(`${p.height} m`);
      else if (p.levels) bits.push(`${p.levels} level${p.levels > 1 ? 's' : ''}`);
      const rec = owned.get(p.id);
      if (rec) {
        const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
        bits.push(`⚑ ${cfg.label.toLowerCase()}`);
        if (rec.cls === 'factory' && rec.lines) bits.push(`🏭 ${rec.lines}`);
      } else {
        const co = companyFor(f);
        if (co) {
          const s = stateFor(co);
          bits.push(`${co.name} · ${co.sector} · pays $${companyPrice(co, s)} (demand ${s.demand})`);
        } else {
          // "from" price = cheapest class the player can currently buy
          const minCls = hqId !== null ? 'warehouse' : 'hq';
          bits.push(`from ≈ $${buildingPrice(f, minCls).toLocaleString()}`);
        }
      }
      return bits.length ? bits.join(' · ') : `Building #${p.osm_id}`;
    };

    // Popover headers get a short name plus footprint size; the long
    // middle-dot string from describeFeature stays on the hover tooltip.
    const titleOf = (f) => {
      const p = f.properties || {};
      if (p.name) return p.name;
      if (p.class && p.class !== 'yes') {
        const c = String(p.class).replace(/_/g, ' ');
        return c.charAt(0).toUpperCase() + c.slice(1);
      }
      return `Building #${p.osm_id}`;
    };
    const sizeOf = (f) =>
      `${Math.round(areaOf(f.properties.id, f.geometry)).toLocaleString()} m²`;

    map.on('mousemove', 'osm-buildings-fill', (e) => {
      const f = e.features && e.features[0];
      if (!f) return;
      map.getCanvas().style.cursor = 'pointer';

      // Update the single-feature highlight source (copy ownership class along)
      map.getSource('building-highlight').setData({
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: f.geometry,
          properties: { ...f.properties, cls: (owned.get(f.properties.id) || {}).cls,
            co: companyFor(f) ? 1 : 0 }
        }]
      });
      hoveredGeom = f.geometry;

      popup.setLngLat(e.lngLat).setHTML(
        `<strong>${describeFeature(f)}</strong>`
      ).addTo(map);
    });

    map.on('mouseleave', 'osm-buildings-fill', () => {
      map.getCanvas().style.cursor = '';
      map.getSource('building-highlight').setData({
        type: 'FeatureCollection', features: []
      });
      hoveredGeom = null;
      popup.remove();
    });

    // Future interaction entry point: clicking a building
    map.on('click', 'osm-buildings-fill', (e) => {
      const f = e.features && e.features[0];
      if (!f) return;

      // Turf point-in-polygon check: confirm the click point is truly inside
      const clickPoint = turf.point([e.lngLat.lng, e.lngLat.lat]);
      const geom = f.geometry;
      let inside = false;

      if (geom.type === 'Polygon') {
        inside = turf.booleanPointInPolygon(clickPoint, geom);
      } else if (geom.type === 'MultiPolygon') {
        // Test each ring of the multipolygon
        inside = geom.coordinates.some((poly) =>
          turf.booleanPointInPolygon(clickPoint, turf.polygon(poly))
        );
      }

      console.log('Building inspected:', f.properties, 'point-in-polygon:', inside);

      if (!inside) return; // click was on the bbox edge, not really inside

      // ---- Inspect only (purchases happen through the right-click buy menu) ----
      const id = f.properties.id;
      const rec = owned.get(id);
      let status;
      if (rec) {
        const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
        const since = new Date(rec.ts);
        status = `Owned (${cfg.label}) since ${since.toLocaleDateString()} ${since.toLocaleTimeString()}`;
        if (rec.cls === 'factory') status += ` · ${rec.lines || 0} line${(rec.lines || 0) === 1 ? '' : 's'}`;
      } else {
        const minCls = hqId !== null ? 'warehouse' : 'hq';
        status = hqId === null
          ? `Not owned — your first purchase must be a Headquarters (≈ $${buildingPrice(f, minCls).toLocaleString()} here)`
          : `Not owned — right-click to buy (from ≈ $${buildingPrice(f, minCls).toLocaleString()} here)`;
      }

      new maplibregl.Popup({ offset: 12 })
        .setLngLat(e.lngLat)
        .setHTML(`<strong>${describeFeature(f)}</strong><br/>
                  <small>${status}</small>`)
        .addTo(map);
    });

    // ---- Right-click: buy / manage-building context menu ----
    document.getElementById('map').addEventListener('contextmenu', (e) => e.preventDefault());

    const buildingMenu = document.getElementById('building-menu');
    let menuBuildingId = null;
    let menuFeature = null;

    // The onboarding hint retires itself once you've opened a building menu.
    const HINT_KEY = 'chatteris-hint-seen';
    const hintEl = document.getElementById('hint');
    if (hintEl && localStorage.getItem(HINT_KEY)) hintEl.style.display = 'none';

    const closeBuildingMenu = () => {
      buildingMenu.style.display = 'none';
      buildingMenu.classList.remove('from-tl', 'from-tr', 'from-bl', 'from-br');
      setMenuTarget(null);
      menuBuildingId = null;
      menuFeature = null;
    };

    // Wire the shared "Sell building" button in the owned menu view. Selling
    // re-renders the menu, which now shows the buy view (building un-owned).
    const wireSellButton = () => {
      const btn = buildingMenu.querySelector('#sell-building');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (!menuFeature || !menuBuildingId) return;
        if (sellBuilding(menuBuildingId, menuFeature.geometry)) renderBuildingMenu();
      });
    };

    const renderBuildingMenu = () => {
      if (!menuFeature) return;
      const id = menuBuildingId;
      const rec = owned.get(id);

      // ---- Unowned: BUY menu (with the strict headquarters-first lock) ----
      if (!rec) {
        // Company sites get a market view (sell / buyout) instead of buy rows —
        // buying the site IS the buyout, which turns it into an office.
        const co = companyFor(menuFeature);
        if (co) {
          const s = stateFor(co);
          const price = companyPrice(co, s);
          const buyout = companyBuyoutPrice(co);
          const n10 = Math.min(10, s.demand, products);
          const nAll = Math.min(s.demand, products);
          buildingMenu.innerHTML = `
            <div class="pop-title">
              <span class="badge co-badge">Company</span>${escHtml(co.name)}
              <span class="pop-sub">${escHtml(co.sector)} · ${Math.round(co.area).toLocaleString()} m²</span>
            </div>
            <div class="row">Pays <strong>$${price}</strong> per product</div>
            <div class="row">Wants <strong>${s.demand}</strong> of ${s.cap} this tick</div>
            <div class="stack">
              <button class="btn btn--wide btn--cash" data-sell="all" ${nAll > 0 ? '' : 'disabled'}>Sell ${nAll} for $${(nAll * price).toLocaleString()}</button>
              <button class="btn btn--wide" data-sell="10" ${n10 > 0 ? '' : 'disabled'}>Sell ${n10} for $${(n10 * price).toLocaleString()}</button>
              <button class="btn btn--wide" data-buyout="1" ${wallet >= buyout ? '' : 'disabled'}
                      title="Buy the building as an office — the company relocates nearby">
                Buy site — $${buyout.toLocaleString()}
              </button>
            </div>`;
          buildingMenu.querySelectorAll('button[data-sell]').forEach((btn) => {
            btn.addEventListener('click', () => {
              sellTo(co, btn.dataset.sell === 'all' ? s.demand : 10);
              renderBuildingMenu();
            });
          });
          buildingMenu.querySelector('button[data-buyout]').addEventListener('click', () => {
            if (buyoutCompany(co)) renderBuildingMenu();
          });
          return;
        }
        const rows = [];
        for (const [key, cfg] of Object.entries(BUILDING_CLASSES)) {
          if (cfg.unique && hqId !== null) continue;          // HQ row hidden once owned
          const locked = !cfg.unique && hqId === null;        // strict lock until HQ bought
          const price = buildingPrice(menuFeature, key);
          const affordable = wallet >= price;
          const blocked = locked || !affordable;
          rows.push(`
            <div class="cls-row">
              <span>
                <span class="cls-name"><i class="cls-dot" style="background:${cfg.uiColor}"></i>${cfg.icon} ${cfg.label}</span>
                <div class="cls-note">${locked ? 'Needs a headquarters first' : cfg.desc}</div>
              </span>
              <button class="btn btn--sm${blocked ? '' : ' btn--class'}"
                      ${blocked ? '' : `style="background:${cfg.uiColor}"`}
                      data-buy="${key}" ${blocked ? 'disabled' : ''}
                      title="${locked ? 'Buy your headquarters first' : (affordable ? 'Buy' : 'Not enough cash')}">
                Buy $${price.toLocaleString()}
              </button>
            </div>`);
        }
        buildingMenu.innerHTML = `
          <div class="pop-title">
            ${escHtml(titleOf(menuFeature))}
            <span class="pop-sub">${sizeOf(menuFeature)} · unclaimed</span>
          </div>
          ${rows.join('')}
          ${hqId === null
            ? '<div class="note">Start with a headquarters ⚑ — everything else unlocks after it.</div>'
            : ''}`;
        buildingMenu.querySelectorAll('button[data-buy]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const cls = btn.dataset.buy;
            const cfg = BUILDING_CLASSES[cls];
            const price = buildingPrice(menuFeature, cls);
            if (wallet < price) return;                       // affordability gate
            if (!cfg.unique && hqId === null) return;         // strict HQ gate
            wallet -= price;
            saveWallet();
            updateWalletDisplay();
            owned.set(menuBuildingId, { cls, ts: Date.now(), lines: 0 });
            if (cfg.unique) { hqId = menuBuildingId; saveHq(); }
            saveOwned();
            updateOwnedDisplay();
            updateProductDisplay();  // warehouse purchases raise the storage cap
            applyOwnershipState(menuBuildingId, cls);
            renderBuildingMenu();                             // re-render as the owned view
          });
        });
        return;
      }

      // ---- Owned: manage / info view ----
      const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
      const header = `<div class="pop-title">` +
        `<span class="badge" style="background:${cfg.uiColor}">${cfg.label}</span>` +
        `${escHtml(titleOf(menuFeature))}` +
        `<span class="pop-sub">${sizeOf(menuFeature)}</span></div>`;

      if (rec.cls === 'factory') {
        const lines = rec.lines || 0;
        const cap = buildingCapacity(id, menuFeature.geometry, 'factory');
        const lineCost = cfg.lineCost;
        const canAdd = lines < cap && wallet >= lineCost;
        const whIds = warehousesNear(centroidOf(menuFeature.geometry));
        const full = products >= totalCapacity();
        const storageRow = `Stock <strong>${products.toLocaleString()} / ${totalCapacity().toLocaleString()}</strong>` +
          (full ? ' — full, build a warehouse' : '');
        const deliveryRow = whIds.length
          ? `📦 Output goes to the nearest of your ${whIds.length} warehouse${whIds.length === 1 ? '' : 's'}`
          : '📦 No warehouse yet — output fills the yard';
        const addLabel = lines >= cap
          ? 'At line capacity'
          : `Add a line — $${lineCost.toLocaleString()}${wallet < lineCost ? ' (not enough cash)' : ''}`;
        buildingMenu.innerHTML = `
          ${header}
          <div class="row">Lines <strong>${lines} / ${cap}</strong> · making <strong>${Math.round(lines * factoryOutputMult())}</strong> per tick</div>
          <div class="row">${storageRow}</div>
          <div class="row">${deliveryRow}</div>
          <div class="stack">
            <button class="btn btn--wide${canAdd ? ' btn--class' : ''}"
                    ${canAdd ? `style="background:${cfg.uiColor}"` : ''}
                    id="add-factory-line" ${canAdd ? '' : 'disabled'}>${addLabel}</button>
            <button class="btn btn--wide" id="sell-building" title="Refund: half the buy price. Factory lines are lost.">
              Sell site for $${resalePrice(id, menuFeature.geometry).toLocaleString()}
            </button>
          </div>`;
        buildingMenu.querySelector('#add-factory-line').addEventListener('click', () => {
          const r = owned.get(menuBuildingId);
          if (!r || r.cls !== 'factory') return;
          if ((r.lines || 0) >= buildingCapacity(menuBuildingId, menuFeature.geometry, 'factory') ||
              wallet < lineCost) return;
          wallet -= lineCost;
          saveWallet();
          updateWalletDisplay();
          r.lines = (r.lines || 0) + 1;
          saveOwned();
          renderBuildingMenu();
        });
        wireSellButton();
        return;
      }

      // Warehouse / office / HQ: info + sell (selling a warehouse spills its
      // contents into remaining storage; true overflow auto-sells to the
      // nearest NPC business).
      let effect;
      if (rec.cls === 'warehouse') {
        const cap = warehouseStorage(areaOf(id, menuFeature.geometry));
        effect = `Holding <strong>${stockIn(id).toLocaleString()} / ${cap.toLocaleString()}</strong> products`;
      } else if (rec.cls === 'office') {
        const perTick = Math.round(areaOf(id, menuFeature.geometry) * cfg.cashPerM2PerTick *
          (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1));
        effect = `Earning <strong>$${perTick.toLocaleString()}</strong> per tick`;
      } else {
        effect = `<strong>+${Math.round(cfg.globalBonus * 100)}%</strong> to all production, office income and sale prices`;
      }
      buildingMenu.innerHTML = `${header}<div class="row">${effect}</div>
        <div class="stack">
          <button class="btn btn--wide" id="sell-building" title="Refund: half the buy price.${rec.cls === 'warehouse' ? ' Contents spill into remaining storage (yard + warehouses); true overflow auto-sells to the nearest company.' : rec.cls === 'hq' ? ' You will need a new HQ before buying anything else.' : ''}">
            Sell site for $${resalePrice(id, menuFeature.geometry).toLocaleString()}
          </button>
        </div>
        ${rec.cls === 'hq'
          ? '<div class="note">Selling your headquarters blocks further purchases until you buy a new one.</div>'
          : rec.cls === 'warehouse'
            ? '<div class="note">Selling spills the contents into your remaining storage. Anything that will not fit is auto-sold to the nearest company.</div>'
            : ''}`;
      wireSellButton();
    };

    map.on('contextmenu', 'osm-buildings-fill', (e) => {
      e.preventDefault();
      const f = e.features && e.features[0];
      if (!f) return;

      // Same Turf point-in-polygon gate as left-click
      const clickPoint = turf.point([e.lngLat.lng, e.lngLat.lat]);
      const geom = f.geometry;
      let inside = false;
      if (geom.type === 'Polygon') {
        inside = turf.booleanPointInPolygon(clickPoint, geom);
      } else if (geom.type === 'MultiPolygon') {
        inside = geom.coordinates.some((poly) =>
          turf.booleanPointInPolygon(clickPoint, turf.polygon(poly))
        );
      }
      if (!inside) return;

      menuBuildingId = f.properties.id;
      menuFeature = f;
      renderBuildingMenu();
      buildingMenu.style.display = 'block';
      setMenuTarget(f.geometry);          // outline the footprint it belongs to

      // Position near the cursor, clamped to the viewport. Which corner the
      // popover ends up hinged on decides which way its tail points.
      const pad = 12;
      const r = buildingMenu.getBoundingClientRect();
      let x = e.point.x + pad, y = e.point.y + pad;
      let flipX = false, flipY = false;
      if (x + r.width > window.innerWidth - pad) { x = e.point.x - r.width - pad; flipX = true; }
      if (y + r.height > window.innerHeight - pad) { y = e.point.y - r.height - pad; flipY = true; }
      buildingMenu.style.left = `${Math.max(pad, x)}px`;
      buildingMenu.style.top = `${Math.max(pad, y)}px`;
      buildingMenu.classList.remove('from-tl', 'from-tr', 'from-bl', 'from-br');
      buildingMenu.classList.add(flipY ? (flipX ? 'from-br' : 'from-bl')
                                       : (flipX ? 'from-tr' : 'from-tl'));

      if (hintEl) {
        hintEl.style.display = 'none';
        localStorage.setItem(HINT_KEY, '1');
      }
    });

    // Close the menu on any map interaction or Escape
    map.on('movestart', closeBuildingMenu);
    map.on('click', closeBuildingMenu);
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBuildingMenu(); });

    // ---- Interior rendering utilities ----
    // Owned buildings fade into procedurally-generated pixel-art floors from
    // INTERIOR_MIN_ZOOM (see buildInterior + renderInteriors below, plus the
    // owned-buildings fill-opacity fade on the 'osm-buildings-fill' layer).
    const smoothstep = (edge0, edge1, x) => {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    };

    // LCG seeded from a building id hash — deterministic, not cryptographic
    const seededRand = (seed) => {
      let s = seed >>> 0;
      return () => {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        return s / 0xFFFFFFFF;
      };
    };

    const INTERIOR_MIN_ZOOM = 16;   // interior appears (fades in 15.5 → 16.5)
    const INTERIOR_FULL_ZOOM = 17;  // reference point — fully opaque well before belts (18)

    // Build (once per building) a PIXI.Container holding the pixel-art
    // interior, drawn in the same local frame layoutFor() uses for belt
    // slots: metres scaled to local px (1 local px = MODULE_M/32 m), origin
    // at the bbox centre, U along the longest wall, +V down-screen. Only the
    // container's position / rotation / scale change afterwards (see
    // renderInteriors); everything is clipped to the footprint by a
    // local-space Graphics mask that transforms with the container.
    const buildInterior = (id, cls, geometry) => {
      const layout = layoutFor(id, geometry);
      const { cx, cy, angle } = layout;
      const mLon = M_PER_DEG_LAT * Math.cos(cy * Math.PI / 180);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);
      const PX = 32 / MODULE_M;   // local px per metre in this frame

      // [lng, lat] ring vertex -> local [u, v] px (same rotation as layoutFor)
      const toLocal = ([lon, lat]) => {
        const ex = (lon - cx) * mLon;
        const ny = -(lat - cy) * M_PER_DEG_LAT;
        return [(ex * cosA + ny * sinA) * PX, (-ex * sinA + ny * cosA) * PX];
      };

      // Footprint ring in local px (for the mask + extent maths)
      const ring = geometry.type === 'Polygon'
        ? geometry.coordinates[0]
        : geometry.coordinates[0][0];
      const localRing = ring.map(toLocal);

      // Extent in local px
      let uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
      for (const [u, v] of localRing) {
        if (u < uMin) uMin = u; if (u > uMax) uMax = u;
        if (v < vMin) vMin = v; if (v > vMax) vMax = v;
      }
      const uRange = uMax - uMin, vRange = vMax - vMin;
      const vMid = (vMin + vMax) / 2;

      // 2 m wall clearance — usable floor area inset of the footprint bbox
      const INSET_PX = 2 * PX;
      const iuMin = uMin + INSET_PX, iuMax = uMax - INSET_PX;
      const ivMin = vMin + INSET_PX, ivMax = vMax - INSET_PX;

      const cont = new PIXI.Container();

      // ---- Footprint mask (built once; local space, so it never changes) ----
      const mask = new PIXI.Graphics();
      mask.poly(localRing.flat()).fill({ color: 0xffffff });
      cont.addChild(mask);
      cont.mask = mask;

      // ---- Floor graphics ----
      const g = new PIXI.Graphics();
      cont.addChild(g);

      // Same building id -> same interior, forever
      const rand = seededRand(hash32(id + ':floor'));

      if (cls === 'factory') {
        // 1. Concrete base
        g.rect(uMin, vMin, uRange, vRange).fill({ color: 0x8c8880 });

        // 2. Floor seams — lines across U every 2 m
        const gridStep = 2 * PX;
        for (let v = vMin; v <= vMax; v += gridStep) g.moveTo(uMin, v).lineTo(uMax, v);
        g.stroke({ color: 0x7a7770, width: 1 });

        // 3. Loading zone — middle 40% of the V extent, full U
        const zoneVMin = vMin + 0.3 * vRange;
        const zoneVMax = vMin + 0.7 * vRange;
        const zoneH = zoneVMax - zoneVMin;
        g.rect(uMin, zoneVMin, uRange, zoneH).fill({ color: 0x2a2a22 });

        // 45° hazard stripes, clipped to the zone's U extent (lines where
        // u - v = const; only each diagonal's on-screen span is emitted)
        const stripeSpacing = 8;                       // px between stripe diagonals
        for (let d = uMin - zoneH; d <= uMax + zoneH; d += stripeSpacing * 2) {
          const x1 = Math.max(uMin, Math.min(uMax, d));
          const y1 = zoneVMin + (x1 - d);
          const x2 = Math.max(uMin, Math.min(uMax, d + zoneH));
          const y2 = zoneVMax - ((d + zoneH) - x2);
          if (x2 > x1) g.moveTo(x1, y1).lineTo(x2, y2);
        }
        g.stroke({ color: 0xf0c000, width: 2 });
        g.rect(uMin, zoneVMin, uRange, zoneH).stroke({ color: 0xe6b400, width: 2 });

        // 4. Scattered boxes outside the zone (2–3 m, 1px SE shadow + outline)
        const boxCount = Math.max(3, Math.min(12, Math.floor(areaOf(id, geometry) / 40)));
        const boxColours = [0x8B6344, 0x5C3D1E, 0xA0785A];
        const boxRotations = [0, 15 * Math.PI / 180, -12 * Math.PI / 180, Math.PI / 2];
        for (let i = 0; i < boxCount; i++) {
          let bu, bv, attempts = 0;
          do {
            bu = iuMin + rand() * (iuMax - iuMin);
            bv = ivMin + rand() * (ivMax - ivMin);
            attempts++;
          } while (bv > zoneVMin - INSET_PX && bv < zoneVMax + INSET_PX && attempts < 10);

          const bSize = (2 + rand()) * PX;            // 2–3 m per side
          const bRot = boxRotations[Math.floor(rand() * boxRotations.length)];
          const bCol = boxColours[Math.floor(rand() * 3)];

          // Own container so each box rotates about its own centre
          const boxCont = new PIXI.Container();
          boxCont.position.set(bu, bv);
          boxCont.rotation = bRot;
          const h = bSize / 2;
          const bg = new PIXI.Graphics();
          bg.rect(-h + 1, -h + 1, bSize, bSize).fill({ color: 0x3a2a14 });  // 1px SE shadow
          bg.rect(-h, -h, bSize, bSize).fill({ color: bCol });
          bg.rect(-h, -h, bSize, bSize).stroke({ color: 0x3a2a14, width: 1 });
          boxCont.addChild(bg);
          cont.addChild(boxCont);
        }
      }
      else if (cls === 'warehouse') {
        // 1. Concrete base
        g.rect(uMin, vMin, uRange, vRange).fill({ color: 0x7e8080 });

        // 2. Rack aisles — strips running along V (perpendicular to the
        //    longest wall), one strip per ~5 m of U. Even strips hold a
        //    1.8 m rack bay plus walkway remainder; odd strips are pure
        //    walkway (neighbouring walkways merge into wide aisles).
        const aisleCount = Math.max(2, Math.floor(uRange / (5 * PX)));
        const stripW = uRange / aisleCount;
        for (let i = 0; i < aisleCount; i++) {
          const uStart = uMin + i * stripW;
          const rackW = Math.min(stripW, 1.8 * PX);

          if (i % 2 === 0) {
            // walkway remainder first, so the rack's shadow falls onto it
            g.rect(uStart + rackW, vMin, stripW - rackW, vRange).fill({ color: 0x8a8c8c });
            // rack bay structure
