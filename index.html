<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatteris — 2D Map (MapLibre + OpenFreeMap)</title>

  <!-- Turf.js geospatial analysis -->
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>

  <!-- Chatteris OSM building data (fetched once from Overpass) -->
  <script src="buildings-data.js"></script>

  <!-- Machine sprites (Piskel conveyor, base64-inlined by build-machines-data.mjs) -->
  <script src="machines-data.js"></script>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- PixiJS (conveyor-belt rendering inside buildings) -->
  <script src="https://unpkg.com/pixi.js@8.6.6/dist/pixi.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
    }
    .map-title {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
    }
    .map-title small {
      display: block;
      font-weight: 400;
      font-size: 12px;
      color: #555;
    }
    .hud-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      margin-top: 62px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      font-size: 13px;
    }
    .hud-panel .count {
      font-weight: 600;
    }
    .hud-panel .breakdown {
      color: #555;
    }
    .hud-panel button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .hud-panel button:hover { background: #f0f0f0; }
    .hud-panel button.confirm { background: #c62828; border-color: #c62828; color: #fff; }
    .hud-panel button.confirm:hover { background: #b71c1c; }
    #pixi-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;   /* clicks pass through to the map */
      z-index: 0;             /* above map canvas, below UI panels */
    }
    .building-menu {
      position: absolute;
      z-index: 3;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      padding: 10px 12px;
      font-size: 13px;
      min-width: 230px;
      display: none;
    }
    .building-menu h4 {
      margin: 0 0 6px;
      font-size: 13px;
    }
    .building-menu .row {
      color: #555;
      margin: 2px 0;
    }
    .building-menu .badge {
      display: inline-block;
      border-radius: 4px;
      padding: 0 6px;
      font-size: 11px;
      color: #fff;
      margin-left: 6px;
      vertical-align: 1px;
    }
    .building-menu button {
      margin-top: 8px;
      width: 100%;
      border: 1px solid #2e7d32;
      background: #4caf50;
      color: #fff;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .building-menu button:hover:not(:disabled) { background: #43a047; }
    .building-menu button:disabled {
      border-color: #ccc;
      background: #eee;
      color: #888;
      cursor: not-allowed;
    }
    .building-menu .cls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }
    .building-menu .cls-row button {
      width: auto;
      margin-top: 0;
      white-space: nowrap;
    }
    .building-menu .cls-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .building-menu .cls-note {
      color: #999;
      font-size: 11px;
      text-align: right;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="map-title">
  Chatteris, Cambridgeshire
  <small>2D only · right-click a building to buy it</small>
</div>
<div class="hud-panel">
  <span>Owned: <span class="count" id="owned-count">0</span></span>
  <span class="breakdown" id="owned-breakdown"></span>
  <span>Balance: <span class="count" id="wallet-balance">$100,000</span></span>
  <span>Products: <span class="count" id="product-count">0</span></span>
  <button id="reset-game" title="Clear all owned buildings and restore balance">Reset</button>
</div>
<div class="building-menu" id="building-menu"></div>
<div id="pixi-overlay"></div>

<script>
  // Chatteris town centre
  const CHATTERIS = [0.05030011035594765, 52.45514770133596];

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/liberty', // free OpenFreeMap tiles
    center: CHATTERIS,
    zoom: 14,

    // ---- Lock the map to 2D ----
    pitch: 0,
    bearing: 0,
    maxPitch: 0,            // no tilting possible
    dragRotate: false,      // no right-drag / ctrl-drag rotation
    touchZoomRotate: true,  // keep pinch zoom...
    hash: false
  });

  // Disable pinch-rotation (keep pinch-zoom working)
  if (map.touchZoomRotate) {
    map.touchZoomRotate.disableRotation();
  }

  // Repeatedly force bearing/pitch back to 0 if anything tries to change them
  map.on('pitch', () => { if (map.getPitch() !== 0) map.setPitch(0); });
  map.on('rotate', () => { if (map.getBearing() !== 0) map.resetNorth(); });

  map.on('load', () => {
    // Remove any 3D building layer that might exist in the style
    const layers = map.getStyle().layers || [];
    for (const layer of layers) {
      const id = layer.id.toLowerCase();
      const source = (layer.source || '').toLowerCase();
      if (
        (id.includes('building') && id.includes('3d')) ||
        id.includes('building-3d') ||
        source.includes('building-3d')
      ) {
        map.removeLayer(layer.id);
      }
    }

    // ---- OSM building footprints (flat 2D, from Overpass data) ----
    // The OpenFreeMap tiles generalize buildings heavily at their max zoom (z14),
    // so individual footprints are loaded from a one-time Overpass API export
    // (see fetch-buildings.mjs) and rendered as a local GeoJSON source.
    map.addSource('osm-buildings', {
      type: 'geojson',
      data: window.BUILDINGS_DATA,
      promoteId: 'id'   // each feature gets a stable id like 'w123456' (its OSM way id)
    });

    // Highlight source: holds at most ONE feature (the hovered building),
    // so it stays cheap no matter how many buildings are on screen.
    map.addSource('building-highlight', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });

    // Flat footprint fill — owned buildings get their class colour via feature-state
    map.addLayer({
      id: 'osm-buildings-fill',
      type: 'fill',
      source: 'osm-buildings',
      paint: {
        'fill-color': [
          'match', ['feature-state', 'cls'],
          'factory', '#f5a623',    // amber
          'warehouse', '#5c7aa8',  // slate blue
          'office', '#8e6cc9',     // violet
          'hq', '#e6b422',         // gold
          '#d6cfc7'                // unowned
        ],
        'fill-opacity': [
          'interpolate', ['linear'], ['zoom'],
          13, 0.35,
          15, 0.75,
          17, 0.9
        ],
        'fill-outline-color': [
          'match', ['feature-state', 'cls'],
          'factory', '#b57400',
          'warehouse', '#3c5578',
          'office', '#5e469b',
          'hq', '#a88000',
          '#a99e93'
        ]
      }
    });

    // Highlight layer drawn on top of the fill
    map.addLayer({
      id: 'building-highlight-layer',
      type: 'fill',
      source: 'building-highlight',
      paint: {
        'fill-color': [
          'match', ['get', 'cls'],
          'factory', '#ffc04d',
          'warehouse', '#8fa9cf',
          'office', '#b39ddb',
          'hq', '#ffd54f',
          '#ff8f5e'   // unowned hover
        ],
        'fill-opacity': 0.65,
        'fill-outline-color': [
          'match', ['get', 'cls'],
          'factory', '#b57400',
          'warehouse', '#3c5578',
          'office', '#5e469b',
          'hq', '#a88000',
          '#e5561f'
        ]
      }
    });

    // ---- Building classes & ownership system (persisted in localStorage) ----
    const BUILDING_CLASSES = {
      factory:   { label: 'Factory',      icon: '🏭', color: '#f5a623', costMult: 1.0,
                   m2PerLine: 50, lineCost: 2500, outputPerTick: 1, belt: true,
                   desc: 'produces products' },
      warehouse: { label: 'Warehouse',    icon: '📦', color: '#5c7aa8', costMult: 0.6,
                   outputMultBonus: 0.20,
                   desc: '+20% factory output each' },
      office:    { label: 'Office',       icon: '🏢', color: '#8e6cc9', costMult: 1.5,
                   cashPerM2PerTick: 0.5,
                   desc: 'earns cash every tick' },
      hq:        { label: 'Headquarters', icon: '⚑', color: '#e6b422', costMult: 2.0,
                   unique: true, globalBonus: 0.10,
                   desc: '+10% production & office income' }
    };

    const OWNED_KEY = 'chatteris-owned';
    const HQ_KEY = 'chatteris-hq';
    const LEGACY_CLAIMS_KEY = 'chatteris-claims';
    const LEGACY_FACTORIES_KEY = 'chatteris-factories';

    // Load ownership, migrating any pre-class save file once (non-destructive:
    // legacy keys stay in storage but are never read again after migration —
    // the OLDEST claim becomes the headquarters, the rest become factories,
    // and legacy factory-line counts carry over).
    const loadOwned = () => {
      const raw = localStorage.getItem(OWNED_KEY);
      if (raw) {
        try { return new Map(Object.entries(JSON.parse(raw))); } catch (_) { return new Map(); }
      }
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_CLAIMS_KEY) || '{}');
        const lines = JSON.parse(localStorage.getItem(LEGACY_FACTORIES_KEY) || '{}');
        const entries = Object.entries(legacy).sort((a, b) => a[1] - b[1]);
        const migrated = new Map();
        let firstHqId = null;
        for (const [id, ts] of entries) {
          const cls = firstHqId === null ? 'hq' : 'factory';
          if (cls === 'hq') firstHqId = id;
          migrated.set(id, { cls, ts, lines: Number(lines[id]) || 0 });
        }
        if (firstHqId !== null) localStorage.setItem(HQ_KEY, firstHqId);
        return migrated;
      } catch (_) { return new Map(); }
    };

    const owned = loadOwned();

    // Police the persisted HQ id: it must point at a currently-owned HQ record.
    let hqId = null;
    const candidateHq = localStorage.getItem(HQ_KEY);
    if (candidateHq && owned.has(candidateHq) && owned.get(candidateHq).cls === 'hq') {
      hqId = candidateHq;
    } else {
      localStorage.removeItem(HQ_KEY);
    }

    const saveOwned = () => {
      localStorage.setItem(OWNED_KEY, JSON.stringify(Object.fromEntries(owned)));
    };
    const saveHq = () => {
      if (hqId === null) localStorage.removeItem(HQ_KEY);
      else localStorage.setItem(HQ_KEY, hqId);
    };

    const ownedCountEl = document.getElementById('owned-count');
    const ownedBreakdownEl = document.getElementById('owned-breakdown');
    const updateOwnedDisplay = () => {
      ownedCountEl.textContent = owned.size;
      const parts = [];
      for (const [key, cfg] of Object.entries(BUILDING_CLASSES)) {
        if (cfg.unique) {
          if (hqId !== null) parts.push('⚑ HQ');
          continue;
        }
        let n = 0;
        for (const r of owned.values()) if (r.cls === key) n++;
        if (n > 0) parts.push(`${cfg.label[0]}${n}`);   // e.g. F3 · W1 · O2
      }
      ownedBreakdownEl.textContent = parts.length ? `(${parts.join(' · ')})` : '';
    };
    updateOwnedDisplay();

    // ---- Wallet / currency system ($10 per m² of footprint) ----
    const WALLET_KEY = 'chatteris-wallet';
    const PRICE_PER_M2 = 10;
    const STARTING_BALANCE = 100000;

    const loadWallet = () => {
      const v = Number(localStorage.getItem(WALLET_KEY));
      return Number.isFinite(v) ? v : STARTING_BALANCE;
    };
    const saveWallet = () => {
      localStorage.setItem(WALLET_KEY, String(wallet));
    };
    const walletEl = document.getElementById('wallet-balance');
    const updateWalletDisplay = () => {
      walletEl.textContent = '$' + wallet.toLocaleString();
    };

    let wallet = loadWallet();
    updateWalletDisplay();

    // Building prices (area × $10/m² × class cost multiplier), memoized by id|cls
    const priceCache = new Map();
    const buildingPrice = (f, cls) => {
      const key = `${f.properties.id}|${cls}`;
      if (!priceCache.has(key)) {
        const mult = BUILDING_CLASSES[cls] ? BUILDING_CLASSES[cls].costMult : 1;
        priceCache.set(key, Math.round(turf.area(f.geometry) * PRICE_PER_M2 * mult));
      }
      return priceCache.get(key);
    };

    // Footprint area in m², memoized by id (used for office income)
    const areaCache = new Map();
    const areaOf = (id, geometry) => {
      if (!areaCache.has(id)) areaCache.set(id, turf.area(geometry));
      return areaCache.get(id);
    };

    // ---- Production system (factory lines + products + office income) ----
    const PRODUCTS_KEY = 'chatteris-products';
    const TICK_MS = 10000;         // one production tick every 10s

    let products = Math.max(0, Number(localStorage.getItem(PRODUCTS_KEY)) || 0);

    const productsEl = document.getElementById('product-count');
    const updateProductDisplay = () => { productsEl.textContent = products.toLocaleString(); };
    updateProductDisplay();

    const totalLines = () => {
      let n = 0;
      for (const rec of owned.values()) if (rec.cls === 'factory') n += rec.lines || 0;
      return n;
    };
    const classCount = (cls) => {
      let n = 0;
      for (const rec of owned.values()) if (rec.cls === cls) n++;
      return n;
    };
    // Factory output multiplier: each warehouse adds +20%, the HQ adds +10%.
    const factoryOutputMult = () =>
      (1 + BUILDING_CLASSES.warehouse.outputMultBonus * classCount('warehouse')) *
      (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1);

    // Line capacity: footprint area (m² per line from the class registry),
    // clamped to the number of belt modules that physically fit inside the
    // footprint (memoized). See layoutFor().
    const capacityCache = new Map();
    const buildingCapacity = (id, geometry, cls = 'factory') => {
      const key = `${id}|${cls}`;
      if (!capacityCache.has(key)) {
        const m2PerLine = (BUILDING_CLASSES[cls] && BUILDING_CLASSES[cls].m2PerLine) ||
                          BUILDING_CLASSES.factory.m2PerLine;
        const areaCap = Math.max(1, Math.floor(turf.area(geometry) / m2PerLine));
        const slotCap = layoutFor(id, geometry).slots.length;
        capacityCache.set(key, Math.max(1, Math.min(areaCap, slotCap)));
      }
      return capacityCache.get(key);
    };

    // Lazy id -> geometry lookup so persisted factories can be drawn after reload
    let geomById = null;
    const geometryFor = (id) => {
      if (!geomById) {
        geomById = new Map();
        for (const f of (window.BUILDINGS_DATA.features || [])) {
          if (f.properties && f.properties.id) geomById.set(f.properties.id, f.geometry);
        }
      }
      return geomById.get(id) || null;
    };

    // Production tick: every 10s factories produce products and offices earn cash
    setInterval(() => {
      const lines = totalLines();
      const mult = factoryOutputMult();
      if (lines > 0) {
        products += Math.round(lines * BUILDING_CLASSES.factory.outputPerTick * mult);
        localStorage.setItem(PRODUCTS_KEY, String(products));
        updateProductDisplay();
      }
      let officeCash = 0;
      for (const [id, rec] of owned) {
        if (rec.cls !== 'office') continue;
        const geom = geometryFor(id);
        if (!geom) continue;
        officeCash += areaOf(id, geom) * BUILDING_CLASSES.office.cashPerM2PerTick *
                      (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1);
      }
      if (officeCash >= 1) {
        wallet += Math.round(officeCash);
        saveWallet();
        updateWalletDisplay();
      }
    }, TICK_MS);

    // Apply persisted ownership to the map's feature states
    const applyOwnershipState = (id, cls) => {
      try { map.setFeatureState({ source: 'osm-buildings', id }, { cls }); } catch (_) {}
    };
    for (const [id, rec] of owned) applyOwnershipState(id, rec.cls);

    // Reset button — two-step confirm so the game isn't wiped accidentally
    const resetBtn = document.getElementById('reset-game');
    let confirmTimer = null;
    resetBtn.addEventListener('click', () => {
      if (!resetBtn.classList.contains('confirm')) {
        resetBtn.classList.add('confirm');
        resetBtn.textContent = 'Confirm?';
        confirmTimer = setTimeout(() => {
          resetBtn.classList.remove('confirm');
          resetBtn.textContent = 'Reset';
        }, 3000);
        return;
      }
      clearTimeout(confirmTimer);
      for (const id of owned.keys()) {
        try { map.removeFeatureState({ source: 'osm-buildings', id }, 'cls'); } catch (_) {}
      }
      owned.clear();
      hqId = null;
      saveOwned();
      saveHq();
      updateOwnedDisplay();
      wallet = STARTING_BALANCE;
      saveWallet();
      updateWalletDisplay();
      products = 0;
      localStorage.setItem(PRODUCTS_KEY, '0');
      updateProductDisplay();
      refreshBelts();
      resetBtn.classList.remove('confirm');
      resetBtn.textContent = 'Reset';
    });

    // ---- Interaction hooks (hover + click) ----
    const popup = new maplibregl.Popup({
      closeButton: false,
      closeOnClick: false,
      offset: 12
    });

    let hoveredGeom = null;

    const describeFeature = (f) => {
      const p = f.properties || {};
      const bits = [];
      if (p.name) bits.push(p.name);
      if (p.class && p.class !== 'yes') bits.push(String(p.class).replace(/_/g, ' '));
      if (p.height) bits.push(`${p.height} m`);
      else if (p.levels) bits.push(`${p.levels} level${p.levels > 1 ? 's' : ''}`);
      const rec = owned.get(p.id);
      if (rec) {
        const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
        bits.push(`⚑ ${cfg.label.toLowerCase()}`);
        if (rec.cls === 'factory' && rec.lines) bits.push(`🏭 ${rec.lines}`);
      } else {
        // "from" price = cheapest class the player can currently buy
        const minCls = hqId !== null ? 'warehouse' : 'hq';
        bits.push(`from ≈ $${buildingPrice(f, minCls).toLocaleString()}`);
      }
      return bits.length ? bits.join(' · ') : `Building #${p.osm_id}`;
    };

    map.on('mousemove', 'osm-buildings-fill', (e) => {
      const f = e.features && e.features[0];
      if (!f) return;
      map.getCanvas().style.cursor = 'pointer';

      // Update the single-feature highlight source (copy ownership class along)
      map.getSource('building-highlight').setData({
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: f.geometry,
          properties: { ...f.properties, cls: (owned.get(f.properties.id) || {}).cls }
        }]
      });
      hoveredGeom = f.geometry;

      popup.setLngLat(e.lngLat).setHTML(
        `<strong>${describeFeature(f)}</strong>`
      ).addTo(map);
    });

    map.on('mouseleave', 'osm-buildings-fill', () => {
      map.getCanvas().style.cursor = '';
      map.getSource('building-highlight').setData({
        type: 'FeatureCollection', features: []
      });
      hoveredGeom = null;
      popup.remove();
    });

    // Future interaction entry point: clicking a building
    map.on('click', 'osm-buildings-fill', (e) => {
      const f = e.features && e.features[0];
      if (!f) return;

      // Turf point-in-polygon check: confirm the click point is truly inside
      const clickPoint = turf.point([e.lngLat.lng, e.lngLat.lat]);
      const geom = f.geometry;
      let inside = false;

      if (geom.type === 'Polygon') {
        inside = turf.booleanPointInPolygon(clickPoint, geom);
      } else if (geom.type === 'MultiPolygon') {
        // Test each ring of the multipolygon
        inside = geom.coordinates.some((poly) =>
          turf.booleanPointInPolygon(clickPoint, turf.polygon(poly))
        );
      }

      console.log('Building inspected:', f.properties, 'point-in-polygon:', inside);

      if (!inside) return; // click was on the bbox edge, not really inside

      // ---- Inspect only (purchases happen through the right-click buy menu) ----
      const id = f.properties.id;
      const rec = owned.get(id);
      let status;
      if (rec) {
        const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
        const since = new Date(rec.ts);
        status = `Owned (${cfg.label}) since ${since.toLocaleDateString()} ${since.toLocaleTimeString()}`;
        if (rec.cls === 'factory') status += ` · ${rec.lines || 0} line${(rec.lines || 0) === 1 ? '' : 's'}`;
      } else {
        const minCls = hqId !== null ? 'warehouse' : 'hq';
        status = hqId === null
          ? `Not owned — your first purchase must be a Headquarters (≈ $${buildingPrice(f, minCls).toLocaleString()} here)`
          : `Not owned — right-click to buy (from ≈ $${buildingPrice(f, minCls).toLocaleString()} here)`;
      }

      new maplibregl.Popup({ offset: 12 })
        .setLngLat(e.lngLat)
        .setHTML(`<strong>${describeFeature(f)}</strong><br/>
                  <small>${status}</small>`)
        .addTo(map);
    });

    // ---- Right-click: buy / manage-building context menu ----
    document.getElementById('map').addEventListener('contextmenu', (e) => e.preventDefault());

    const buildingMenu = document.getElementById('building-menu');
    let menuBuildingId = null;
    let menuFeature = null;

    const closeBuildingMenu = () => {
      buildingMenu.style.display = 'none';
      menuBuildingId = null;
      menuFeature = null;
    };

    const renderBuildingMenu = () => {
      if (!menuFeature) return;
      const id = menuBuildingId;
      const rec = owned.get(id);

      // ---- Unowned: BUY menu (with the strict headquarters-first lock) ----
      if (!rec) {
        const rows = [];
        for (const [key, cfg] of Object.entries(BUILDING_CLASSES)) {
          if (cfg.unique && hqId !== null) continue;          // HQ row hidden once owned
          const locked = !cfg.unique && hqId === null;        // strict lock until HQ bought
          const price = buildingPrice(menuFeature, key);
          const affordable = wallet >= price;
          rows.push(`
            <div class="cls-row">
              <span>
                <span class="cls-dot" style="background:${cfg.color}"></span>${cfg.icon} ${cfg.label}
                <div class="cls-note">${locked ? 'requires HQ' : cfg.desc}</div>
              </span>
              <button data-buy="${key}" ${locked || !affordable ? 'disabled' : ''}
                      title="${locked ? 'Buy your Headquarters first' : (affordable ? 'Buy' : 'Insufficient funds')}">
                Buy $${price.toLocaleString()}
              </button>
            </div>`);
        }
        buildingMenu.innerHTML = `
          <h4>${describeFeature(menuFeature)}</h4>
          ${rows.join('')}
          ${hqId === null
            ? '<div class="row" style="margin-top:8px">Your first purchase must be a Headquarters ⚑</div>'
            : ''}`;
        buildingMenu.querySelectorAll('button[data-buy]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const cls = btn.dataset.buy;
            const cfg = BUILDING_CLASSES[cls];
            const price = buildingPrice(menuFeature, cls);
            if (wallet < price) return;                       // affordability gate
            if (!cfg.unique && hqId === null) return;         // strict HQ gate
            wallet -= price;
            saveWallet();
            updateWalletDisplay();
            owned.set(menuBuildingId, { cls, ts: Date.now(), lines: 0 });
            if (cfg.unique) { hqId = menuBuildingId; saveHq(); }
            saveOwned();
            updateOwnedDisplay();
            applyOwnershipState(menuBuildingId, cls);
            renderBuildingMenu();                             // re-render as the owned view
          });
        });
        return;
      }

      // ---- Owned: manage / info view ----
      const cfg = BUILDING_CLASSES[rec.cls] || BUILDING_CLASSES.factory;
      const header = `<h4>${describeFeature(menuFeature)}` +
        `<span class="badge" style="background:${cfg.color}">${cfg.label}</span></h4>`;

      if (rec.cls === 'factory') {
        const lines = rec.lines || 0;
        const cap = buildingCapacity(id, menuFeature.geometry, 'factory');
        const lineCost = cfg.lineCost;
        const canAdd = lines < cap && wallet >= lineCost;
        const reason = lines >= cap ? ' (at capacity)' : wallet < lineCost ? ' (not enough funds)' : '';
        buildingMenu.innerHTML = `
          ${header}
          <div class="row">Factory lines: <strong>${lines} / ${cap}</strong></div>
          <div class="row">Output: ${Math.round(lines * factoryOutputMult())} product${lines === 1 ? '' : 's'} / 10s</div>
          ${lines < cap ? `<div class="row">Next line: $${lineCost.toLocaleString()}</div>` : ''}
          <button id="add-factory-line" ${canAdd ? '' : 'disabled'}>
            + Add factory line${reason}
          </button>`;
        buildingMenu.querySelector('#add-factory-line').addEventListener('click', () => {
          const r = owned.get(menuBuildingId);
          if (!r || r.cls !== 'factory') return;
          if ((r.lines || 0) >= buildingCapacity(menuBuildingId, menuFeature.geometry, 'factory') ||
              wallet < lineCost) return;
          wallet -= lineCost;
          saveWallet();
          updateWalletDisplay();
          r.lines = (r.lines || 0) + 1;
          saveOwned();
          renderBuildingMenu();
        });
        return;
      }

      // Warehouse / office / HQ: information only (conversion & selling are
      // deferred features — hooks live in BUILDING_CLASSES).
      let effect;
      if (rec.cls === 'warehouse') {
        effect = `+${Math.round(cfg.outputMultBonus * 100)}% factory output (now ×${factoryOutputMult().toFixed(2)})`;
      } else if (rec.cls === 'office') {
        const perTick = Math.round(areaOf(id, menuFeature.geometry) * cfg.cashPerM2PerTick *
          (hqId !== null ? 1 + BUILDING_CLASSES.hq.globalBonus : 1));
        effect = `≈ $${perTick.toLocaleString()} / 10s`;
      } else {
        effect = `+${Math.round(cfg.globalBonus * 100)}% to all production and office income`;
      }
      buildingMenu.innerHTML = `${header}<div class="row">${effect}</div>`;
    };

    map.on('contextmenu', 'osm-buildings-fill', (e) => {
      e.preventDefault();
      const f = e.features && e.features[0];
      if (!f) return;

      // Same Turf point-in-polygon gate as left-click
      const clickPoint = turf.point([e.lngLat.lng, e.lngLat.lat]);
      const geom = f.geometry;
      let inside = false;
      if (geom.type === 'Polygon') {
        inside = turf.booleanPointInPolygon(clickPoint, geom);
      } else if (geom.type === 'MultiPolygon') {
        inside = geom.coordinates.some((poly) =>
          turf.booleanPointInPolygon(clickPoint, turf.polygon(poly))
        );
      }
      if (!inside) return;

      menuBuildingId = f.properties.id;
      menuFeature = f;
      renderBuildingMenu();
      buildingMenu.style.display = 'block';
      // Position near the cursor, clamped to the viewport
      const pad = 8;
      const r = buildingMenu.getBoundingClientRect();
      let x = e.point.x + pad, y = e.point.y + pad;
      if (x + r.width > window.innerWidth - pad) x = e.point.x - r.width - pad;
      if (y + r.height > window.innerHeight - pad) y = e.point.y - r.height - pad;
      buildingMenu.style.left = `${Math.max(pad, x)}px`;
      buildingMenu.style.top = `${Math.max(pad, y)}px`;
    });

    // Close the menu on any map interaction or Escape
    map.on('movestart', closeBuildingMenu);
    map.on('click', closeBuildingMenu);
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBuildingMenu(); });

    // ---- PixiJS conveyor belts inside factory buildings ----
    // Each factory line renders as one animated belt module (custom Piskel
    // sprite from machines-data.js), laid out on an interior grid that
    // follows the footprint's longest edge. Layouts are computed once per
    // building and cached; the render loop only updates position / scale /
    // rotation from map.project(), so panning and zooming stay cheap.
    const BELT_MIN_ZOOM = 18;                     // below this belts are unreadable
    const MODULE_M = 4;                           // world size (m) of one 32px module
    const ROW_GAP_M = MODULE_M * (22 / 32);       // trimmed art is 22px of 32
    const FRAME_MS = 120;                         // ms per animation frame
    const MAX_SLOTS = 64;                         // safety cap per building
    const M_PER_DEG_LAT = 111320;

    const bboxCache = new Map();
    const bboxOfGeometry = (id, geometry) => {
      if (bboxCache.has(id)) return bboxCache.get(id);
      let minX = 180, minY = 90, maxX = -180, maxY = -90;
      const scan = (coords) => {
        for (const c of coords) {
          if (typeof c[0] === 'number') {
            if (c[0] < minX) minX = c[0];
            if (c[0] > maxX) maxX = c[0];
            if (c[1] < minY) minY = c[1];
            if (c[1] > maxY) maxY = c[1];
          } else scan(c);
        }
      };
      scan(geometry.coordinates);
      const b = [minX, minY, maxX, maxY];
      bboxCache.set(id, b);
      return b;
    };

    // Bearing (screen convention, clockwise from east) of the polygon's
    // longest edge — belt rows align to the building's main wall.
    const longestEdgeAngle = (geometry, cy) => {
      let ring = null;
      if (geometry.type === 'Polygon') ring = geometry.coordinates[0];
      else if (geometry.type === 'MultiPolygon' && geometry.coordinates.length) {
        ring = geometry.coordinates[0][0];
      }
      if (!ring || ring.length < 2) return 0;
      const mLon = M_PER_DEG_LAT * Math.cos(cy * Math.PI / 180);
      let best = 0, bestLen = -1;
      for (let i = 0; i < ring.length - 1; i++) {
        const dx = (ring[i + 1][0] - ring[i][0]) * mLon;
        const dy = -(ring[i + 1][1] - ring[i][1]) * M_PER_DEG_LAT;
        const len = dx * dx + dy * dy;
        if (len > bestLen) { bestLen = len; best = Math.atan2(dy, dx); }
      }
      // Fold into -90..90° so the axis (not its direction) is deterministic
      if (best > Math.PI / 2) best -= Math.PI;
      if (best < -Math.PI / 2) best += Math.PI;
      return best;
    };

    // Layout cache: id -> { cx, cy, angle, slots: [{sx, sy}] }
    // Slots are ordered row-by-row along the long axis (they fill in order
    // as lines are added). sx/sy are offsets in module-pixel space (32px =
    // one module) relative to the bbox centre, in the rotated local frame.
    const layoutCache = new Map();
    const layoutFor = (id, geometry) => {
      if (layoutCache.has(id)) return layoutCache.get(id);
      const [minX, minY, maxX, maxY] = bboxOfGeometry(id, geometry);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const mLon = M_PER_DEG_LAT * Math.cos(cy * Math.PI / 180);
      const angle = longestEdgeAngle(geometry, cy);
      const cosA = Math.cos(angle), sinA = Math.sin(angle);

      // Extent of the bbox once rotated into the belt frame
      let minE = Infinity, maxE = -Infinity, minN = Infinity, maxN = -Infinity;
      for (const [lon, lat] of [[minX, minY], [minX, maxY], [maxX, minY], [maxX, maxY]]) {
        const ex = (lon - cx) * mLon, ny = -(lat - cy) * M_PER_DEG_LAT;
        const e = ex * cosA + ny * sinA;      // world -> local (rotate -angle)
        const n = -ex * sinA + ny * cosA;
        if (e < minE) minE = e; if (e > maxE) maxE = e;
        if (n < minN) minN = n; if (n > maxN) maxN = n;
      }

      const slots = [];
      const cols = Math.max(1, Math.floor((maxE - minE) / MODULE_M));
      const rows = Math.max(1, Math.floor((maxN - minN) / ROW_GAP_M));
      for (let r = 0; r < rows && slots.length < MAX_SLOTS; r++) {
        const n = minN + (r + 0.5) * ROW_GAP_M;
        for (let c = 0; c < cols && slots.length < MAX_SLOTS; c++) {
          const e = minE + (c + 0.5) * MODULE_M;
          // local -> world lng/lat, then point-in-polygon (holes respected)
          const wx = cx + (e * cosA - n * sinA) / mLon;
          const wy = cy - (e * sinA + n * cosA) / M_PER_DEG_LAT;
          if (turf.booleanPointInPolygon([wx, wy], geometry)) {
            slots.push({ sx: (e / MODULE_M) * 32, sy: (n / MODULE_M) * 32 });
          }
        }
      }
      if (!slots.length) slots.push({ sx: 0, sy: 0 }); // tiny building: 1 centre belt

      const layout = { cx, cy, angle, slots };
      layoutCache.set(id, layout);
      return layout;
    };

    let pixiApp = null;
    let beltRoot = null;                        // holds one container per building
    let beltFrames = [];                        // one texture per animation frame
    const beltContainers = new Map();           // building id -> PIXI.Container

    // One belt module. Today: Piskel flipbook sprite, rotated 90° so the
    // belt's vertical flow runs along +x (the row direction). If a seamless
    // cap-less `tile` is ever added to MACHINE_ASSETS.conveyor, swap this
    // factory over to a TilingSprite — everything else stays unchanged.
    const makeBeltSprite = () => {
      const s = new PIXI.Sprite(beltFrames[0] || PIXI.Texture.EMPTY);
      s.anchor.set(0.5);
      s.rotation = Math.PI / 2;
      return s;
    };

    const renderBelts = () => {
      if (!pixiApp || !beltRoot) return;
      const zoom = map.getZoom();
      beltRoot.visible = zoom >= BELT_MIN_ZOOM;
      if (!beltRoot.visible || !beltFrames.length) return;

      const w = pixiApp.screen.width, h = pixiApp.screen.height;
      const mpp = 156543.03392 * Math.cos(CHATTERIS[1] * Math.PI / 180) / Math.pow(2, zoom);
      const scale = (MODULE_M / mpp) / 32;
      const frameIdx = Math.floor(performance.now() / FRAME_MS) % beltFrames.length;

      for (const [id, rec] of owned) {
        if (rec.cls !== 'factory' || !rec.lines) continue;   // belts are factory-class only
        const lines = rec.lines;
        let cont = beltContainers.get(id);
        const geom = geometryFor(id);
        if (!geom) { if (cont) cont.visible = false; continue; }
        const layout = layoutFor(id, geom);

        if (!cont) {
          cont = new PIXI.Container();
          beltRoot.addChild(cont);
          beltContainers.set(id, cont);
        }

        // Off-screen culling via the footprint bbox
        const [minX, minY, maxX, maxY] = bboxOfGeometry(id, geom);
        const tl = map.project([minX, maxY]);
        const br = map.project([maxX, minY]);
        if (br.x < 0 || tl.x > w || br.y < 0 || tl.y > h) { cont.visible = false; continue; }
        cont.visible = true;

        const n = Math.min(lines, layout.slots.length);
        while (cont.children.length < n) cont.addChild(makeBeltSprite());
        for (let i = 0; i < cont.children.length; i++) {
          const s = cont.children[i];
          s.visible = i < n;
          if (i < n) {
            s.position.set(layout.slots[i].sx, layout.slots[i].sy);
            s.texture = beltFrames[frameIdx];
          }
        }
        const anchor = map.project([layout.cx, layout.cy]);
        cont.position.set(anchor.x, anchor.y);
        cont.rotation = layout.angle;
        cont.scale.set(scale);
      }

      // Drop containers for buildings that no longer have factory lines
      for (const id of [...beltContainers.keys()]) {
        const r = owned.get(id);
        if (!r || r.cls !== 'factory' || !r.lines) {
          beltContainers.get(id).destroy({ children: true });
          beltContainers.delete(id);
        }
      }
    };

    // Hook for factory-state changes (reset, etc.) — drops cached layouts and
    // belt containers so the next frame rebuilds from fresh state.
    const refreshBelts = () => {
      layoutCache.clear();
      capacityCache.clear();
      for (const c of beltContainers.values()) c.destroy({ children: true });
      beltContainers.clear();
    };

    (async () => {
      try {
        pixiApp = new PIXI.Application();
        await pixiApp.init({
          backgroundAlpha: 0,
          resizeTo: document.getElementById('map'),
          antialias: false,   // pixel art must not be smoothed
          resolution: 1
        });
        document.getElementById('pixi-overlay').appendChild(pixiApp.canvas);

        const asset = window.MACHINE_ASSETS && window.MACHINE_ASSETS.conveyor;
        if (asset) {
          const base = await PIXI.Assets.load(asset.image);   // data URI -> Texture
          base.source.scaleMode = 'nearest';                   // crisp pixel art
          beltFrames = asset.frames.map((f) => new PIXI.Texture({
            source: base.source,
            frame: new PIXI.Rectangle(f.x, f.y, asset.frameWidth, asset.frameHeight)
          }));
        } else {
          console.warn('machines-data.js missing — conveyor belts disabled');
        }

        beltRoot = new PIXI.Container();
        pixiApp.stage.addChild(beltRoot);
        pixiApp.ticker.add(() => renderBelts());
      } catch (err) {
        console.warn('PixiJS overlay failed to initialise:', err);
      }
    })();
  });

  // ---- Scrolling: MapLibre default wheel-zoom behaviour ----
  // (native smoothed zoom — no custom handler)

  // ---- Smoother panning: gentler drag inertia ----
  try { map.dragPan.enable({ maxSpeed: 1.6, deceleration: 2500 }); } catch (_) {}

  // Controls
  map.addControl(new maplibregl.NavigationControl({
    showCompass: false,     // no compass = no rotate/pitch control
    visualizePitch: false
  }), 'top-right');
  map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');
  map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }));

  // Marker on the town centre
  new maplibregl.Marker({ color: '#d9534f' })
    .setLngLat(CHATTERIS)
    .setPopup(new maplibregl.Popup({ offset: 24 }).setText('Chatteris'))
    .addTo(map);
</script>

</body>
</html>
